<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大气环境文献日报 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
</style>
</head>

,"tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"gis","id":115},{"title":"Remote sensing and deep learning for standing dead-tree detection and mapping: a review of advances, challenges, and future directions","url":"https://doi.org/10.1016/j.isprsjprs.2026.09.050","doi":"10.1016/j.isprsjprs.2026.09.050","journal":"ISPRS Journal of Photogrammetry and Remote Sensing","jabbr":"ISPRS Journal of Photogrammetry and Remote Sensing","pubdate":"2026-10-07","topic":"遥感","topics":["遥感"],"matchTerm":"remote sensing","matchWhere":"标题：remote sensing","score":9,"authors":["Anwarul Islam Chowdhury","Mirela Beloiu","Teja Kattenborn","Clemens Mosig","Mete Ahishali","Mikko Vastaranta"],"authorMore":true,"abstract":"Standing dead trees are visible indicators of tree mortality and an important transitional component linking forest disturbance to future lying deadwood, habitat availability, and carbon storage. As drought, insect outbreaks, pathogens, and climate extremes intensify tree mortality worldwide, scalable methods are needed to detect and map standing dead trees consistently across forest landscapes. Recent advances in high-resolution remote sensing and computer-vision-based deep learning, including object detection, semantic segmentation, instance segmentation, and transformer-based models, have increased the automation and spatial detail of standing dead-tree detection and mapping. This …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"rs","id":116},{"title":"Australia’s current wildfire crisis linked to colonial land-use change","url":"https://www.nature.com/articles/s41586-026-11097-z","doi":"10.1038/s41586-026-11097-z","journal":"Nature","jabbr":"Nature","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"标题：land-use","score":9,"authors":["Michael-Shawn Fletcher","Anthony Romano","Caitlin O’Shea","S. Yoshi Maezumi","Harriet Magee","Simon Connor"],"authorMore":true,"abstract":"is often attributed to climate change, a framing that overlooks crucial historical drivers. Biomes at the forefront of this crisis, such as the temperate eucalypt forests of Australia, have seen alarming increases in large, intense wildfires in recent decades. Yet evidence of how colonial land-use change and the disruption of Indigenous fire use altered vegetation structure and fuel dynamics remains scarce. Here we reconstruct 1,000 years of vegetation and fire change in a temperate eucalypt forest in southeastern Australia. Before the British invasion (from 1788 CE), fire use by the Indigenous Gunaikurnai people maintained stable, open woodlands through frequent, fine-grained, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"gis","id":117},{"title":"Robotic urbanization and embodied intelligence for cities","url":"https://doi.org/10.1038/s44284-026-00536-7","doi":"10.1038/s44284-026-00536-7","journal":"Nature Cities","jabbr":"Nat Cities","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urbanization","matchWhere":"标题：urbanization","score":9,"authors":["Ying Li","Tim Wu","Jian Zhou","Bicheng Han","Jiawei Yang","Michael Keith"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"gis","id":118},{"title":"Shaping street canyon heat: Dominant biophysical drivers vary across scales and time in Guangzhou, China","url":"https://doi.org/10.1016/j.uclim.2026.103177","doi":"10.1016/j.uclim.2026.103177","journal":"Urban Climate","jabbr":"Urban Climate","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"street canyon","matchWhere":"标题：street canyon","score":9,"authors":["Min Jiao","Hao Liu","Luping Huang","Wenyun Yang","Hongxiao Liu","Kai Ning"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"gis","id":119},{"title":"Rainfall scavenging of PM2.5 chemical components in Nanjing, China","url":"https://doi.org/10.1016/j.uclim.2026.103172","doi":"10.1016/j.uclim.2026.103172","journal":"Urban Climate","jabbr":"Urban Climate","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5","score":9,"authors":["Ting Tang","Yan Yin","Jialu Xu","Qian Wang","Yuying Wang"],"authorMore":false,"abstract":"Atmospheric aerosols, particularly PM2.5, profoundly influence air quality, human health, and climate, especially in industrial regions. Nanjing, as a representative industrial megacity in eastern China, is still influenced by heavy air pollution from time to time, although PM2.5 has been decreasing remarkably in the last decade. There is still lack of a full understanding how PM2.5 is accumulated in the air and how the individual chemical components of PM2.5 respond to rainfall scavenging. This study investigates the wet scavenging effects of precipitation on PM2.5 and its chemical components, utilizing high-resolution data collected from December 2020 to November 2021 in Nanjing. A …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"air","id":120},{"title":"Large Methane Emissions during Ice-Melt Periods in a Temperate Pond","url":"https://doi.org/10.1021/acs.est.6c06834","doi":"10.1021/acs.est.6c06834","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"标题：methane","score":9,"authors":["Xueqi Niu","Zhifeng Yan","Liping Hao","Liu Liu","Si-Liang Li","Mike Peacock"],"authorMore":false,"abstract":"Abstract Large methane (CH4) emissions during ice-melt periods have been frequently reported in lakes, but whether similar processes occur in ponds remains largely unknown. Here, we conducted observations in a temperate pond across two consecutive ice seasons (2022–2024), with daily sampling during ice melt, to characterize ice-melt CH4 dynamics, reveal potential CH4 production pathways, and estimate the contribution of ice-melt emissions to the annual CH4 budget. CH4 concentrations increased sharply prior to ice melt, resulting in a diffusive pulse during the ice-melt periods (20.1 ± 14.1 mg m–2 h–1), approximately 11 times higher than that during observed ice-free periods (1.8 ± 2.5 mg …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"bgc","id":121},{"title":"Effects of Mineralogical Inhomogeneity on Aggregate Dust Optical Properties and Lidar Observables","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL125856?af=R","doi":"10.1029/2026gl125856","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-07","topic":"遥感","topics":["遥感"],"matchTerm":"lidar","matchWhere":"标题：lidar","score":9,"authors":["Dongchen Li","Ping Yang"],"authorMore":false,"abstract":"Abstract Dust aerosols comprise irregular grains and aggregates with various mineralogical mixtures. However, most optical models use effective refractive indices to represent particles. This study develops an inhomogeneous aggregate model assigning mineral-dependent refractive indices to constituent elements and representing global mineral volume fractions. A synergistically unified approach combining the invariant-imbedding T-matrix, improved geometric optics, and physical-geometric optics methods computes the single-scattering properties. Furthermore, polarized Monte Carlo radiative transfer simulations are conducted to quantify lidar observables. Mineralogical inhomogeneity has little …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"rs","id":122},{"title":"A solid magnesium zincate for hydrogen-methane evolution","url":"https://www.science.org/doi/abs/10.1126/sciadv.aej2622?af=R","doi":"10.1126/sciadv.aej2622","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-07","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"标题：methane","score":9,"authors":["Sheetal Kathayat Bisht","Poorna Gomathisankaran","Alex P. Andrews","Ajay Venugopal"],"authorMore":false,"abstract":"Hydrogen-methane blends are gaining attention as transitional fuels, but their safe storage and controlled release remain a challenge. Advancing this approach necessitates the development of compounds and materials capable of solid-state storage of mixed fuel gases. Molecular precursors capable of delivering both gases from a single source are not known. In this context, we report a low–molecular weight magnesium hydridomethylzincate, Mg[(CH 3)ZnH 3], a crystalline, hydride-rich organometallic compound that does not rely on bulky supporting ligands. Under solvent-free, anaerobic conditions, it releases hydrogen and methane at temperatures as low as 80°C via reductive elimination, leaving …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"bgc","id":123},{"title":"Cross-phase partitioning of sulfur-nitrogen ratios and aerosol mixing-state evolution based on single-particle observations","url":"https://doi.org/10.5194/acp-26-14015-2026","doi":"10.5194/acp-26-14015-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-06","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Yuan Dai","Junfeng Wang","Mindong Chen","Su Zhang","Haiwei Li","Yunjiang Zhang"],"authorMore":true,"abstract":"The balance between sulfur and nitrogen (S-N) precursors influences secondary aerosol formation, yet its cross-phase links to particle composition and mixing states remain poorly constrained. Here, we integrated single-particle aerosol mass spectrometry (SPA-MS) with pollutant and meteorological observations during winter and summer emission control periods (ECPs) and corresponding normal periods (NPs) in Yangzhou, eastern China. By establishing gas-phase (gSNR), particle-phase (pSNR), and number-based (nSNR) sulfur-to-nitrogen ratio metrics, we combined causal inference with interpretable machine learning to analyze the underlying drivers. During ECPs, reduced NOₓ emissions alongside …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":124},{"title":"Measurements of the Size and Physical Properties of Marine Particles Using Atomic Force Microscopy: Implications for Marine Biogeochemical Cycles","url":"https://doi.org/10.1029/2026gl122474","doi":"10.1029/2026gl122474","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"标题：biogeochemical","score":9,"authors":["Y. Yamada","T. Mochizuki","H. Fukuda","T. Nagata","S. Mitarai"],"authorMore":false,"abstract":"Abstract Particle size and physical properties such as stiffness and adhesiveness affect sinking velocity and flux in the ocean, yet conventional two‐dimensional measurements lack accuracy and mechanical information. In this study, we applied atomic force microscopy (AFM) to quantify three‐dimensional size and physical properties of marine particles. Three hundred and sixty‐eight particles were collected using a marine snow catcher from the pycnocline and benthic boundary layer at three coastal‐to‐offshore stations in the northwestern Pacific. Particle equivalent spherical diameters (ESDs) ranged from 0.4 to 32 μm, with \u003e70% smaller than 10 μm. Two‐dimensional analyses overestimated ESDs of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"bgc","id":125},{"title":"Anthropogenic aerosol reduction contributes to faster flash drought onset in a changing climate","url":"https://doi.org/10.1038/s41467-026-78230-4","doi":"10.1038/s41467-026-78230-4","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-06","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Jia Wei","Shuo Wang","Weiguang Wang","Jason A. Otkin","Diego G. Miralles","Amir AghaKouchak"],"authorMore":false,"abstract":" heric corrosion of materials, requiring maintenance and replacement over time. However, the dimensions of sea spray aerosol plumes produced from breaking waves have not been well‐characterized, limiting useful prediction of particle transport downwind and atmospheric corrosion. Therefore, this project aimed to measure sea spray aerosol production from breaking waves in a controlled environment at several elevations to obtain the height profile of an aerosol plume. Measurements were conducted using a 13.7 × 6.7 m pool with 1.5 m depth filled to 101.6 cm with Instant Ocean® at the Laboratory for Autonomous Systems (LASR), Naval …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-06","tkey":"air","id":128},{"title":"Consistent estimates of carbonyl sulfide and methane stratospheric lifetimes retrieved from AirCore profiles at different latitudes","url":"https://doi.org/10.5194/acp-26-13909-2026","doi":"10.5194/acp-26-13909-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-05","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"标题：methane","score":9,"authors":[],"authorMore":false,"abstract":"Consistent estimates of carbonyl sulfide and methane stratospheric lifetimes retrieved from AirCore profiles at different latitudes Alessandro Zanchetta, Steven van Heuven, Rigel Kivi, Michel Ramonet, Andreas Engel, Maarten Krol, and Huilin Chen Atmos. Chem. Phys., 26, 13909–13927, https://doi.org/10.5194/acp-26-13909-2026, 2026 In this study, we calculate the mean lifetime of carbonyl sulfide (COS) and methane (CH4) in the stratosphere from continuous vertical profiles sampled with balloon-borne instruments. We used two methods based on the stratospheric relationship of these gas species with N2O. The estimated stratospheric lifetime range is 69–90 years for COS and 146–172 years for CH4. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-05","tkey":"bgc","id":129},{"title":"Biochar–Straw Interaction Drives Soil Carbon Accrual by Modulating Microbial Metabolic Pathways","url":"https://doi.org/10.1021/acs.est.6c03354","doi":"10.1021/acs.est.6c03354","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-02","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"标题：soil carbon","score":9,"authors":["Rui Ma","Yifeng Zhang","Xiaodong Zheng","Xiang Li","Lan Wei","Lianxi Huang"],"authorMore":true,"abstract":"Abstract Straw and biochar additions can enhance long-term carbon storage, yet how their interactions regulate carbon mineralization and allocation remains unclear. We conducted a 360-day microcosm incubation employing a reciprocal 13C-labeling design that paired 13C-labeled straw with unlabeled biochar and unlabeled straw with 13C-labeled biochar and used single-cell Raman spectroscopy and 13C-labeled cell metagenomics. At day 360, biochar reduced cumulative straw-derived 13CO2 from 1391 to 1199 mg C kg–1 soil, while increasing straw-C allocation to fulvic acid (FA) and humic acid (HA) fractions. This shift was associated with enrichment of bacterial taxa such as Chitinophagales and …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"bgc","id":130},{"title":"Deciphering Aerosol-Monsoon Variability over South Asia under different phases of ENSO","url":"https://doi.org/10.1016/j.atmosenv.2026.122400","doi":"10.1016/j.atmosenv.2026.122400","journal":"Atmospheric Environment","jabbr":"Atmos Environ","pubdate":"2026-10-01","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Anushri Pal","Sushant Das","Saurabh Kumar","Vijayakumar Sivadasan Nair"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"air","id":131},{"title":"Mapping agricultural dynamics in displacement-affected landscapes using satellite foundation model embeddings","url":"https://doi.org/10.1088/1748-9326/aeabbc","doi":"10.1088/1748-9326/aeabbc","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Abena Boatemaa Asare-Ansah","Jamon Van Den Hoek","Adebowale Daniel Adebayo","Xiao-Peng Song","Catherine Nakalembe"],"authorMore":false,"abstract":"Abstract Sub-Saharan Africa already faces low human development, extreme climate risks, and environmental degradation–pressures compounded by large-scale population displacement resulting from armed conflict. Nowhere are these intersecting challenges more evident than in Uganda, which currently hosts the largest refugee population in Africa (nearly 2 million), straining land management, natural resources, and local food systems. As is common across displacement settings, spatially explicit baseline agricultural data in Uganda’s refugee-hosting regions remain scarce, limiting land-use planning, food security assessments, and humanitarian interventions. We present the first high-resolution …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":132},{"title":"Bulk PM2.5 Masks Oxidative Potential and Reactive Oxygen Species Responses by Metal–Organic Complexation in PM1 and PM1–2.5 Fractions","url":"https://doi.org/10.1021/acs.est.6c09837","doi":"10.1021/acs.est.6c09837","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"空气污染","topics":["空气污染"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5","score":9,"authors":["Jianing Liu","Lijin Zeng","Chen Tang","Yuting Shen","Yingjing Miao","Jiewen Huang"],"authorMore":true,"abstract":"Abstract Bulk PM2.5 measurements are widely used to assess the oxidative toxicity of particulate matter, but they integrate size fractions that differ in composition and respiratory deposition. We show that mixing PM1 and PM1–2.5 from a roadside site produces pronounced antagonistic effects on oxidative potential (OP) and reactive oxygen species (ROS) generation, with interaction factors (IFs) below 1 across all end points: OP by the ascorbic acid assay (IF = 0.65–0.81), OP by the dithiothreitol assay (IF = 0.80–0.93), ROS (IF = 0.10–0.88), and mitochondrial superoxide (IF = 0.43–0.78). This antagonism requires metal–organic interactions as metal-free biomass burning PM exhibits strictly …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"air","id":133},{"title":"Tackling fluffy clouds: robust agricultural field boundary delineation from Sentinel-1 and Sentinel-2 satellite image time series","url":"https://doi.org/10.1016/j.rse.2026.115695","doi":"10.1016/j.rse.2026.115695","journal":"Remote Sensing of Environment","jabbr":"RSE","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Foivos I. Diakogiannis","Zheng-Shu Zhou","Jeff Wang","Gonzalo Mata","David A. Henry","Roger Lawes"],"authorMore":true,"abstract":"Accurate delineation of agricultural field boundaries is essential for effective crop monitoring and resource management. However, competing methodologies often face significant challenges, particularly in their reliance on extensive manual efforts for cloud-free data curation and their limited adaptability to diverse global conditions. In this paper, we introduce PTAViT3D, a deep learning architecture specifically designed for processing three-dimensional time series of satellite imagery from either Sentinel-1 (S1) or Sentinel-2 (S2). Additionally, we present PTAViT3D-CA, an extension of the PTAViT3D model incorporating cross-attention mechanisms to fuse S1 and S2 datasets, enhancing …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":134},{"title":"Discrepancies between Sentinel-2 and LiDAR-derived LAI in temperate deciduous forests: Influence of apparent optical depth, radiative transfer priors, and horizontal heterogeneity","url":"https://doi.org/10.1016/j.rse.2026.115698","doi":"10.1016/j.rse.2026.115698","journal":"Remote Sensing of Environment","jabbr":"RSE","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"lidar","matchWhere":"标题：lidar","score":9,"authors":["Nathan Corroyez","Jean‐Baptiste Féret","Jérôme Ogée","Jonathan Lenoir","Sylvie Durrieu"],"authorMore":false,"abstract":"Accurate estimation of forest leaf area index (LAI) from satellite images remains challenging due to limited sunlight penetration and intricate scattering through structurally complex canopies. We compared LAI estimated from radiative transfer model PROSAIL hybrid inversion applied to Sentinel-2 (S2) images with LAI derived from airborne LiDAR across three temperate deciduous forests in France. We assessed three factors driving discrepancies between the two estimates: (1) the attenuation of the optical signal reducing the apparent canopy depth contributing to S2 reflectance, (2) the parametrisation of the PROSAIL inversion, and (3) the local horizontal heterogeneity in canopy height. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":135},{"title":"EarthCARE reveals details on the role of rain in closed-to-open cell transitions","url":"https://doi.org/10.5194/acp-26-14085-2026","doi":"10.5194/acp-26-14085-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：satellite","score":6,"authors":["Johanna Mayer","Daniele Gasbarra","Robin J. Hogan","Edward Malina","Shannon L. Mason","Blanka Piskala Gvozdikova"],"authorMore":false,"abstract":"The mesoscale organisation of marine stratocumulus clouds into closed and open cells strongly affects cloud albedo and thus their cooling effect on climate, yet the processes governing transitions between these regimes remain incompletely understood. The EarthCARE satellite provides collocated observations of cloud mesoscale structure from the Multi-Spectral Imager (MSI) together with vertically resolved cloud and precipitation measurements from the Atmospheric Lidar (ATLID) and Cloud Profiling Radar (CPR), enabling detailed characterization of stratocumulus cloud microphysics. We apply a convolutional neural network to MSI scenes to identify closed and open cells and relate these …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"air","id":136},{"title":"Aging of Urban Traffic Fine Particles Modulates Toxicity Mechanisms and Oxidative Stress Responses","url":"https://doi.org/10.1021/acs.est.6c06323","doi":"10.1021/acs.est.6c06323","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air pollution","matchWhere":"摘要：air pollution、摘要：photochemical","score":6,"authors":["Michal Pardo","Noga Kozer","Carolina Molina","Yanfang Chen","Haim Barr","Galit Cohen"],"authorMore":true,"abstract":"Abstract Vehicular emissions are an important source of urban air pollution that can age through atmospheric processes, but how their health effects change during atmospheric aging remains poorly understood. To simulate realistic urban emissions, we sampled air in a parking garage where cold-start and urban emissions coexist. Following aging in an oxidation flow reactor (OFR), we studied the cellular and acellular effects of the fresh and aged aerosols. Photochemical aging in the OFR increased secondary organic aerosol (SOA) mass by up to 6.9-fold, the oxygen-to-carbon (O:C) ratio from 0.26 to 0.79, and both the intrinsic oxidative potential (OPm) and the volume-normalized oxidative …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"air","id":137},{"title":"Height-Prompt Mixture of Experts for multimodal 3D building change detection","url":"https://doi.org/10.1016/j.isprsjprs.2026.09.037","doi":"10.1016/j.isprsjprs.2026.09.037","journal":"ISPRS Journal of Photogrammetry and Remote Sensing","jabbr":"ISPRS Journal of Photogrammetry and Remote Sensing","pubdate":"2026-10-07","topic":"遥感","topics":["遥感","城市地理信息系统"],"matchTerm":"remote sensing","matchWhere":"摘要：remote sensing、摘要：urbanization","score":6,"authors":["Hao Liu","Yongjie Zheng","Yi Yuan","Mingyang Zhang","Maoguo Gong","Lorenzo Bruzzone"],"authorMore":false,"abstract":"Rapid global urbanization and high-rise expansion demand effective 3D building change detection techniques based on remote sensing data for critical real-world applications, including urban monitoring, disaster assessment, and 3D city modeling. Recently, integrating optical imagery with digital surface models (DSMs) has emerged as an effective solution because DSMs provide explicit geometric information that complements RGB texture, enabling reliable detection of vertical structural variations, floor additions, and roof changes that are difficult to infer from optical imagery alone. However, existing methods extract DSMs based on the image domain processing paradigms, ignoring the potential …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"rs","id":138},{"title":"The 2023–2024 El Niño as a Preview of Future Tropical Forest Climate","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008071?af=R","doi":"10.1029/2026ef008071","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-07","topic":"遥感","topics":["遥感","生物地球化学"],"matchTerm":"satellite","matchWhere":"摘要：satellite、摘要：carbon cycle","score":6,"authors":[],"authorMore":false,"abstract":"Abstract Tropical forests are an important component of the global carbon cycle. Increasingly frequent droughts and heatwaves are undermining their resilience, with far-reaching impacts on local livelihoods and on regional and global hydrological cycles. El Niño events, recurring climate patterns that lead to dry and hot conditions across multiple tropical regions, have always influenced these dynamics, but the 2023–2024 El Niño produced extreme droughts and heatwaves that exceeded the typical El Niño footprint. Here, we place the 2023–2024 El Niño in both past (2000–2024) and future (2025–2100) climatic contexts across pantropical forests. We assess its climatic magnitude using ensembles …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"rs","id":139},{"title":"Spatially Refined Analysis of Emission Burdens and Equity from Light-, Medium-, and Heavy-Duty Vehicle Traffic in the United States","url":"https://doi.org/10.1021/acs.est.6c12227","doi":"10.1021/acs.est.6c12227","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"particulate matter","matchWhere":"摘要：particulate matter、摘要：nox","score":6,"authors":["Brittany Antonczak","Clare Nelson","Tammy M. Thompson","Mindi W. DePaola","Gregory Rowangould"],"authorMore":false,"abstract":"Abstract We estimate block-level emission intensities of nitrogen oxides (NOX) and fine particulate matter (PM2.5) from on-road vehicle traffic for every census block in the United States, combining MOVES-based emission factors with street level traffic data. We use this spatially refined, computationally efficient, and policy-sensitive metric to evaluate emissions burden. Despite comprising less than 11% of vehicle kilometers traveled, we find that medium- and heavy-duty trucks account for 46% of NOX and 50% of PM2.5 emission burden nationally ─ with PM2.5 burden from trucks dominated by exhaust emissions while tire and brake wear constitute nearly half of light-duty vehicle PM2.5 burden. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"air","id":140},{"title":"Surface temperatures drive strong seasonality in urban reactive carbon emissions","url":"https://www.science.org/doi/abs/10.1126/sciadv.aef9622?af=R","doi":"10.1126/sciadv.aef9622","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air quality","matchWhere":"摘要：air quality、摘要：voc","score":6,"authors":["Michael P. Vermeuel","Dylan B. Millet","Róisín Commane","Timothy J. Griffis","Trey A. Maddaleno","Emily B. Franklin"],"authorMore":true,"abstract":"Urban air quality is affected by diverse volatile organic compounds (VOCs), and prior studies reveal a need to understand their seasonal sources. We combine high-resolution mass spectrometry with eddy covariance to quantify VOC fluxes from an urban/suburban New York site during summer and winter. Emissions are strongly seasonal: During summer, twice as many VOCs undergo surface-atmosphere exchange, and molar and reactivity-based fluxes are 2 to 4× higher than in winter. Temperature-dependent emissions from volatile chemical products (VCPs), vegetation, and residences dominate during summer. Ethanol alone accounts for ∼25% of the total flux. During winter, temperature-dependent emissions are …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"air","id":141},{"title":"Fire carbon emission constraints from space-based carbon monoxide retrievals during the 2019 intense burning season in Brazil","url":"https://doi.org/10.5194/acp-26-13929-2026","doi":"10.5194/acp-26-13929-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-06","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"emission inventory","matchWhere":"摘要：emission inventory、摘要：satellite","score":6,"authors":["Anne-Wil van den Berg","Joram J. D. Hooghiem","Auke M. van der Woude","Pieter Rijsdijk","Roland Vernooij","Santiago Botía"],"authorMore":true,"abstract":"In 2019, Brazil experienced an intensive fire season, despite the absence of major climate anomalies to enhance fire activity. Existing carbon monoxide (CO) emission estimates from state-of-the-art fire emission inventories differ by a factor two for the period and region. We provide a top-down estimate on CO emissions from these fires using the new CarbonTracker Europe – Long-Window/Short-Window (CTE-LW/SW) inverse modelling framework driven by column-averaged dry air CO mole fractions (X CO) from the MOPITT and TROPOMI satellite instruments. Our analysis indicates that the 2019 fires in Brazil released approximately 47 TgCO. Although structural atmospheric-chemistry related …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":142},{"title":"Reactive Oxygen Species Trigger Rapid Natural Purification of Soils and Water in Wetlands","url":"https://doi.org/10.1021/acs.est.6c06553","doi":"10.1021/acs.est.6c06553","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"大气化学","topics":["大气化学","生物地球化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical、摘要：biogeochemical","score":6,"authors":["Binbin Wu","Jingyi Wang","Guanghui Yu","Liang Mao","Lin Xu","Guodong Fang"],"authorMore":true,"abstract":"Abstract Wetlands, often referred to as the “Earth’s kidneys”, are essential ecosystems that filter pollutants and regulate biogeochemical processes. However, the mechanisms underlying their rapid self-purification are still in their infancy and lack deep understanding. Here, we propose that reactive oxygen species (ROS) constitute an intrinsic oxidative network that drives accelerated pollutant transformation in wetlands. We summarize that ROS are generated through coupled photochemical and redox-driven processes and are highly concentrated at environmental interfaces, including soil–water, fluctuating redox boundaries, and rhizosphere. These interfaces function as reactive hotspots where …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"chem","id":143},{"title":"Forest and bioenergy expansion amplifies climate warming by accelerating regional cloud loss","url":"https://doi.org/10.5194/acp-26-14133-2026","doi":"10.5194/acp-26-14133-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-09","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Nanjian Liu","Zhixin Hao","Siyou Xia","Peng Zhao"],"authorMore":false,"abstract":"Land use and cover change (LUCC) can exacerbate cloud-mediated climate warming, yet long-term cloud responses to contrasting LUCC pathways remain poorly quantified. Here, we perform transient simulations based on the fully coupled Community Earth System Model (CESM) under the SSP1-2.6 scenario to quantify how long-term cloud trends respond to large-scale idealized afforestation (AF50, conversion of grassland or shrubland to forest), idealized bioenergy expansion (BE50, sugarcane expansion), and realistic afforestation (REAL). AF50 drives a pronounced vertical restructuring of cloud trends, steepening mid-level cloud decline and accelerating low-level cloud loss from −0.0153 ± 0.0030 % yr −1 …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":144},{"title":"Reduced semi-arid summer carbon dioxide efflux from agrivoltaic compared to conventional horticultural soil","url":"https://doi.org/10.1088/1748-9326/aeb1dd","doi":"10.1088/1748-9326/aeb1dd","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"摘要：soil carbon","score":3,"authors":["Holly Andrews","Fabiana Olea Carrasco","Alyssa Salazar","Zoe Gineris","Talitha H Neesham-McTiernan","G. Darrel Jenerette"],"authorMore":true,"abstract":"Abstract Agrivoltaic (AV) systems that combine horticultural crops with photovoltaic (PV) infrastructure on the same land parcel can provide mutual benefits for crop performance, electricity production, and water use in semi-arid climates. Whether semi-arid AV systems provide additional benefits for soil development and carbon (C) accumulation remains unclear. Larger aboveground biomass and yield production, which has been observed in semi-arid AV for certain crops, may accelerate C loss by supporting more continual and extensive microbial and root respiration, resulting in net zero or negative change in soil C over a growing season. Alternatively, AV systems may retain more soil C by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"bgc","id":145},{"title":"Role of atmospheric circulation and anthropogenic forcing in the extreme 2025 European summer heatwave","url":"https://doi.org/10.1088/1748-9326/aeb1e0","doi":"10.1088/1748-9326/aeb1e0","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Yan Chen","Wen Chen","Shangfeng Chen","Juan Feng","Tianjiao Ma"],"authorMore":false,"abstract":"Abstract In summer 2025, an extreme heatwave propagated northeastward across Europe, sequentially affecting Southwestern (SWEU) and Northern (NEU) Europe with record-breaking durations in the 1979-2025 record. However, the roles of atmospheric circulation and anthropogenic forcing in the 2025 European high-temperature conditions remain unclear. Here we show that atmospheric circulation explains 82.5% (95% uncertainty interval: 65.0-99.0%) and 51.9% (37.0-65.2%) of the regional mean maximum temperature (Tmax) anomalies averaged over the respective heatwave periods in SWEU and NEU, respectively, based on the flow analogue method. Extreme anticyclonic circulation is associated with extreme …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"air","id":146},{"title":"The effects of China's Major Function-Oriented Zoning on construction land expansion: The role of resource factors","url":"https://doi.org/10.1016/j.cities.2026.107671","doi":"10.1016/j.cities.2026.107671","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Shihao Zhu","Tao Liu","Daquan Huang","Longfei Zheng","Yanxu Liu"],"authorMore":false,"abstract":"Although strategic spatial planning is widely used to shape territorial development and protection, its effects on construction land expansion and the underlying mechanisms remain insufficiently examined. Using China's Major Function-Oriented Zoning (MFOZ) as a case, this study evaluates the policy effects, mechanisms, heterogeneity, and spatial spillovers of differentiated construction land expansion across four functional zones. The results show that the MFOZ is only partially effective, evidenced by a deceleration of expansion in optimized development zones and a marked acceleration in major agricultural zones. These dynamics are primarily driven by resource reallocation. While …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":147},{"title":"Proposal and validation of a transferable high-resolution monitoring framework with hotspot analysis for adaptive urban spatial planning in the Global South.","url":"https://doi.org/10.1016/j.cities.2026.107646","doi":"10.1016/j.cities.2026.107646","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Santiago Bonilla‐Bedoya","Rasa Žalakevičiūtė","Danilo Mejía","C. Scott Watson"],"authorMore":false,"abstract":"Adaptive spatial planning requires robust spatiotemporal monitoring of urban land use and land cover change, yet no consensus exists on appropriate spatial, temporal, and spectral resolutions for cities in the Global South. This study addresses this gap by developing and validating a high-resolution monitoring framework for urban expansion to support local spatial planning. Using Quito as a case study, impervious surfaces were mapped for 2013, 2017, and 2023, enabling analysis of two five-year intervals. A random forest classifier was implemented using an integrated set of predictors combining vegetation-sensitive spectral indices (NDVI and SAVI), the Perpendicular Impervious Surface Index …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":148},{"title":"AI-oriented policy and urban ecological quality: Evidence from China's national AI innovation and development pilot zones","url":"https://doi.org/10.1016/j.cities.2026.107640","doi":"10.1016/j.cities.2026.107640","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban development","matchWhere":"摘要：urban development","score":3,"authors":["Shiyuan Wang","Lei Zhou","Zongjun Ling","Shenwei Wan"],"authorMore":false,"abstract":"Artificial intelligence (AI) is increasingly embedded in urban industrial upgrading and policy experimentation, yet its implications for urban ecological conditions remain unclear. This study examines the impact of China's National New Generation Artificial Intelligence Innovation and Development Pilot Zone (AI-IDPZ) policy on urban ecological environment quality (EEQ). Using panel data for 290 Chinese cities from 2008 to 2022 and a staggered difference-in-differences approach, we estimate the average treatment effect of AI-IDPZ implementation and explore its mechanisms, heterogeneity, moderating conditions, and spatial spillovers. The results show that AI-IDPZ implementation significantly …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":149},{"title":"Dynamic urban decarbonisation pathways revealed in rapidly urbanizing Chinese cities","url":"https://doi.org/10.1088/1748-9326/aeb14a","doi":"10.1088/1748-9326/aeb14a","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban structure","matchWhere":"摘要：urban structure","score":3,"authors":["Tong Chen","Felix Creutzig","Ramit Debnath"],"authorMore":false,"abstract":"Abstract Urban economies and thei 6-10-10","tkey":"gis","id":151},{"title":"The role of domestic and international markets in the loss of nature across Brazil","url":"https://doi.org/10.1088/1748-9326/aeacfe","doi":"10.1088/1748-9326/aeacfe","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Damares Lopes Afonso","Fernando Salgueiro Perobelli","Weslem Rodrigues Faria","Erasmus Zu Ermgassen"],"authorMore":false,"abstract":"Abstract Humans have converted a vast area of nature—forests, savannahs, wetlands, and grasslands—for agriculture. Though domestic markets account for more than 70% of global agricultural production and land use change, domestic supply chains and end-uses are rarely mapped. Here, we present an inter-regional input–output model for Brazil, a major agricultural producer and market with an active agricultural frontier, experiencing 70 Mha hectares of vegetation conversion since 2000. We capture the drivers of conversion in each of Brazil’s six biomes from 2010–2015, linking them to 36 economic sectors and 47 Brazilian regions and four external trading partners: the European Union, the United …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":152},{"title":"Landscape pattern zoning-based classification for high-resolution orchard mapping in heterogeneous agricultural landscapes","url":"https://doi.org/10.1016/j.isprsjprs.2026.09.026","doi":"10.1016/j.isprsjprs.2026.09.026","journal":"ISPRS Journal of Photogrammetry and Remote Sensing","jabbr":"ISPRS Journal of Photogrammetry and Remote Sensing","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Zhihua Wang","Xiaowei Zeng","Yueming Liu","Mengmeng Wang","Junyao Zhang","Xiaoliang Liu"],"authorMore":true,"abstract":"High-resolution land-use classification in heterogeneous agricultural landscapes is challenged by geographically varying class–feature relationships that are difficult to represent with a single global classifier. We developed a Landscape Pattern Zoning-based Classification (LPZC) framework that transforms the composition and spatial configuration of historical land use into Landscape Pattern Zones (LPZs), which are then used to organize training samples and fit local classifiers. The framework was evaluated for orchard mapping from 2-m GF-6 imagery in Meishan, China, using fixed training, validation, and independent test partitions; LPZ parameters were selected on the validation set and …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":153},{"title":"Can visibility-based metrics predict soundscape perception in cities?","url":"https://doi.org/10.1016/j.landurbplan.2026.105809","doi":"10.1016/j.landurbplan.2026.105809","journal":"Landscape and Urban Planning","jabbr":"Landscape and Urban Planning","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"geospatial","matchWhere":"摘要：geospatial","score":3,"authors":["Xiang Fang","Tasos Varoudis","Tin Oberman","Andrew Mitchell","Francesco Aletta","Jian Kang"],"authorMore":false,"abstract":"Context plays a central role in soundscape perception within the ISO 12913 series framework. However, there is a lack of empirical evidence on how to identify operational, standardised proxy metrics for capturing ‘context’ in soundscape assessment and prediction. The study addresses this gap by deriving a set of visibility-based metrics from Isovist and Visibility Graph Analysis (VGA) and evaluating their effectiveness in a soundscape predictive model. An on-site soundscape data campaign was conducted in Bloomsbury, Central London., Isovist and VGA metrics were computed for each soundscape observation to obtain a high-resolution, geospatial soundscape dataset (N = 787). Key findings stand …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":154},{"title":"Manureshed Nutrient Dynamics Across the Conterminous United States: Three Decades of Agricultural Flows and Integration With Municipal Wastewater Sources","url":"https://doi.org/10.1111/tgis.70409","doi":"10.1111/tgis.70409","journal":"Transactions in GIS","jabbr":"Transactions in GIS","pubdate":"2026-10-07","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"geographic information system","matchWhere":"摘要：geographic information system","score":3,"authors":["Olatunde David Akanbi","Vibha Mandayam","Aashi Gupta","K. Colton Flynn","Jeffrey M. Yarus","Erika I. Barcelos"],"authorMore":true,"abstract":"ABSTRACT Integrated agricultural and municipal nutrient flows across the conterminous United States (CONUS) exhibit substantial interannual variability and spatial scale dependence that single‐year analyses cannot characterize. Addressing this gap has been limited by manual geospatial workflows that are time‐intensive and non‐reproducible. Here we present manureshed, an R package that enables multi‐temporal (1987–2016) and multi‐scale analysis across county, Hydrologic Unit Code (HUC) 8 watershed, and HUC2 basin levels, integrating nitrogen (N) and phosphorus (P) agricultural nutrient data from the Nutrient Use Geographic Information System (NuGIS; 1987–2016) with municipal wastewater …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"gis","id":155},{"title":"Maillard-like Reactions Generate Secondary Organic Products with Oxidative Potential: Mechanisms and Photoaging Enhancement","url":"https://doi.org/10.1021/acs.est.6c12787","doi":"10.1021/acs.est.6c12787","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Xin Zhu","Qingcai Chen","Tong Sha","Bo Wang","Huan Liu","Yue Yin"],"authorMore":true,"abstract":"Abstract The formation mechanisms and atmospheric evolution of secondary       + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+esc(a.title)+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="sec-t">摘要</div>'
      +   (a.abstract
            ? '<p class="abs">'+esc(a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">该条日报未收录摘要。</p>')
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
