ic Lidar (ATLID) and Cloud Profiling Radar (CPR), enabling detailed characterization of stratocumulus cloud microphysics. We apply a convolutional neural network to MSI scenes to identify closed and open cells and relate these …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"air","id":238},{"title":"Aging of Urban Traffic Fine Particles Modulates Toxicity Mechanisms and Oxidative Stress Responses","url":"https://doi.org/10.1021/acs.est.6c06323","doi":"10.1021/acs.est.6c06323","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air pollution","matchWhere":"摘要：air pollution、摘要：photochemical","score":6,"authors":["Michal Pardo","Noga Kozer","Carolina Molina","Yanfang Chen","Haim Barr","Galit Cohen"],"authorMore":true,"abstract":"Abstract Vehicular emissions are an important source of urban air pollution that can age through atmospheric processes, but how their health effects change during atmospheric aging remains poorly understood. To simulate realistic urban emissions, we sampled air in a parking garage where cold-start and urban emissions coexist. Following aging in an oxidation flow reactor (OFR), we studied the cellular and acellular effects of the fresh and aged aerosols. Photochemical aging in the OFR increased secondary organic aerosol (SOA) mass by up to 6.9-fold, the oxygen-to-carbon (O:C) ratio from 0.26 to 0.79, and both the intrinsic oxidative potential (OPm) and the volume-normalized oxidative …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"air","id":239},{"title":"The 2023–2024 El Niño as a Preview of Future Tropical Forest Climate","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008071?af=R","doi":"10.1029/2026ef008071","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-07","topic":"遥感","topics":["遥感","生物地球化学"],"matchTerm":"satellite","matchWhere":"摘要：satellite、摘要：carbon cycle","score":6,"authors":[],"authorMore":false,"abstract":"Abstract Tropical forests are an important component of the global carbon cycle. Increasingly frequent droughts and heatwaves are undermining their resilience, with far-reaching impacts on local livelihoods and on regional and global hydrological cycles. El Niño events, recurring climate patterns that lead to dry and hot conditions across multiple tropical regions, have always influenced these dynamics, but the 2023–2024 El Niño produced extreme droughts and heatwaves that exceeded the typical El Niño footprint. Here, we place the 2023–2024 El Niño in both past (2000–2024) and future (2025–2100) climatic contexts across pantropical forests. We assess its climatic magnitude using ensembles …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"rs","id":240},{"title":"Spatially Refined Analysis of Emission Burdens and Equity from Light-, Medium-, and Heavy-Duty Vehicle Traffic in the United States","url":"https://doi.org/10.1021/acs.est.6c12227","doi":"10.1021/acs.est.6c12227","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"particulate matter","matchWhere":"摘要：particulate matter、摘要：nox","score":6,"authors":["Brittany Antonczak","Clare Nelson","Tammy M. Thompson","Mindi W. DePaola","Gregory Rowangould"],"authorMore":false,"abstract":"Abstract We estimate block-level emission intensities of nitrogen oxides (NOX) and fine particulate matter (PM2.5) from on-road vehicle traffic for every census block in the United States, combining MOVES-based emission factors with street level traffic data. We use this spatially refined, computationally efficient, and policy-sensitive metric to evaluate emissions burden. Despite comprising less than 11% of vehicle kilometers traveled, we find that medium- and heavy-duty trucks account for 46% of NOX and 50% of PM2.5 emission burden nationally ─ with PM2.5 burden from trucks dominated by exhaust emissions while tire and brake wear constitute nearly half of light-duty vehicle PM2.5 burden. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"air","id":241},{"title":"Surface temperatures drive strong seasonality in urban reactive carbon emissions","url":"https://www.science.org/doi/abs/10.1126/sciadv.aef9622?af=R","doi":"10.1126/sciadv.aef9622","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-07","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"air quality","matchWhere":"摘要：air quality、摘要：voc","score":6,"authors":["Michael P. Vermeuel","Dylan B. Millet","Róisín Commane","Timothy J. Griffis","Trey A. Maddaleno","Emily B. Franklin"],"authorMore":true,"abstract":"Urban air quality is affected by diverse volatile organic compounds (VOCs), and prior studies reveal a need to understand their seasonal sources. We combine high-resolution mass spectrometry with eddy covariance to quantify VOC fluxes from an urban/suburban New York site during summer and winter. Emissions are strongly seasonal: During summer, twice as many VOCs undergo surface-atmosphere exchange, and molar and reactivity-based fluxes are 2 to 4× higher than in winter. Temperature-dependent emissions from volatile chemical products (VCPs), vegetation, and residences dominate during summer. Ethanol alone accounts for ∼25% of the total flux. During winter, temperature-dependent emissions are …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"air","id":242},{"title":"Fire carbon emission constraints from space-based carbon monoxide retrievals during the 2019 intense burning season in Brazil","url":"https://doi.org/10.5194/acp-26-13929-2026","doi":"10.5194/acp-26-13929-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-06","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"emission inventory","matchWhere":"摘要：emission inventory、摘要：satellite","score":6,"authors":["Anne-Wil van den Berg","Joram J. D. Hooghiem","Auke M. van der Woude","Pieter Rijsdijk","Roland Vernooij","Santiago Botía"],"authorMore":true,"abstract":"In 2019, Brazil experienced an intensive fire season, despite the absence of major climate anomalies to enhance fire activity. Existing carbon monoxide (CO) emission estimates from state-of-the-art fire emission inventories differ by a factor two for the period and region. We provide a top-down estimate on CO emissions from these fires using the new CarbonTracker Europe – Long-Window/Short-Window (CTE-LW/SW) inverse modelling framework driven by column-averaged dry air CO mole fractions (X CO) from the MOPITT and TROPOMI satellite instruments. Our analysis indicates that the 2019 fires in Brazil released approximately 47 TgCO. Although structural atmospheric-chemistry related …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":243},{"title":"Reactive Oxygen Species Trigger Rapid Natural Purification of Soils and Water in Wetlands","url":"https://doi.org/10.1021/acs.est.6c06553","doi":"10.1021/acs.est.6c06553","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"大气化学","topics":["大气化学","生物地球化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical、摘要：biogeochemical","score":6,"authors":["Binbin Wu","Jingyi Wang","Guanghui Yu","Liang Mao","Lin Xu","Guodong Fang"],"authorMore":true,"abstract":"Abstract Wetlands, often referred to as the “Earth’s kidneys”, are essential ecosystems that filter pollutants and regulate biogeochemical processes. However, the mechanisms underlying their rapid self-purification are still in their infancy and lack deep understanding. Here, we propose that reactive oxygen species (ROS) constitute an intrinsic oxidative network that drives accelerated pollutant transformation in wetlands. We summarize that ROS are generated through coupled photochemical and redox-driven processes and are highly concentrated at environmental interfaces, including soil–water, fluctuating redox boundaries, and rhizosphere. These interfaces function as reactive hotspots where …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"chem","id":244},{"title":"Impacts of Nuclear War on Human Health From Changed Surface Ultraviolet Radiation","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF009142?af=R","doi":"10.1029/2026ef009142","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Shu Xu","Lili Xia","Alan Robock","Charles Bardeen","Simchan Yook","Sasha Madronich","Soko Setoguchi"],"authorMore":false,"abstract":"Abstract Climate model simulations indicate that surface ultraviolet (UV) radiation would change after soot injection into the stratosphere during a nuclear war, due to the competing effects of ozone depletion and aerosol attenuation. Using climate model simulations, we evaluate UV impacts under two scenarios: a regional India-Pakistan conflict producing 5 Tg of soot and a global U.S.-Russia war producing 150 Tg. UV enhancements due to ozone depletion substantially shorten safe outdoor exposure time, particularly for individuals with lighter skin types. Applying UV dose-response relationships to the year 2000 population data, without accounting for direct conflict mortality or …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"air","id":245},{"title":"Coupled sea-level and biodiversity dynamics during the Cambrian SPICE event","url":"https://doi.org/10.1038/s41467-026-78601-x","doi":"10.1038/s41467-026-78601-x","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-24","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Meng Wang","Yukun Shi","Aihua Yang","Haotian Zhang","Xiaoyu Zhang","Yujing Wu"],"authorMore":true,"abstract":"The prominent Cambrian Steptoean Positive Carbon Isotope Excursion (SPICE) stands as one of Earth’s largest carbon cycle perturbations, marked by widespread marine anoxia, climatic upheaval, and biotic turnover, yet the complete extent and interplay of these environmental changes remain unclear. Here, we integrate high-resolution astrochronology, carbonate carbon isotope records from the North China Block and marine species richness to investigate sedimentary and biogeochemical responses during the SPICE interval. Time series analysis reveals a distinct ~2-million-year sedimentary rhythm that aligns with cycles in reconstructed sea-level fluctuations and biodiversity dynamics. We show that …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"bgc","id":246},{"title":"Mutualistic microbes linked to broader niches but reduced diversification","url":"https://doi.org/10.1038/s41467-026-79030-6","doi":"10.1038/s41467-026-79030-6","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-24","topic":"极端天气","topics":["极端天气"],"matchTerm":"drought","matchWhere":"摘要：drought","score":3,"authors":["Eleanor Hay","Rosana Zenil‐Ferguson","Michelle E. Afkhami","Christopher A. Searcy"],"authorMore":false,"abstract":"Mutualistic interactions are widely hypothesized to broaden ecological niches and promote diversification, yet evidence for this relationship at macroevolutionary scales remains limited. Here, we investigate how fungal seed endophytes (Epichloë) influence niche breadth and diversification across over 100 species of the globally-distributed grass genus Poa. Combining global-scale climate, environmental, phylogenetic, and symbiosis data, we construct species distribution models for suites of symbiotic and non-symbiotic plant species, and use phylogenetic comparative methods to assess the influence of these symbionts on niche breadth, niche breadth evolution, and diversification. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"wx","id":247},{"title":"Benefits of everyday encounters while being out and about: The neighborhood familiarity scale","url":"https://doi.org/10.1016/j.cities.2026.107704","doi":"10.1016/j.cities.2026.107704","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-23","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban planning","matchWhere":"摘要：urban planning","score":3,"authors":["Harald Schuster","Maria‐Therese Friehs","Gesa Solveig Duden","Jolanda van der Noll","Anette Rohmann"],"authorMore":false,"abstract":"Fleeting social and local encounters in the neighborhood might counteract the social uncertainty that sustains loneliness. Yet no existing scale specifically assesses the underlying social and local processes of these encounters. We developed and validated the Neighborhood Familiarity Scale using a multi-method approach to measure the impact of neighborhood encounters. First, eleven qualitative interviews using the “neighborhood go-along method” and five expert pre-tests were conducted to generate the items. Second, the scale was validated via an online survey. An exploratory (n = 161) and a confirmatory (n = 320) factor analysis confirmed two distinct factors: Social and local …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"gis","id":248},{"title":"Intensified human pressures threaten global mountain vertebrate biodiversity","url":"https://doi.org/10.1038/s41467-026-78392-1","doi":"10.1038/s41467-026-78392-1","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-23","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Jianfeng Sun","Guangdong Li","Yue Cao","Ying Zhang","James E. M. Watson","Jianguo Liu"],"authorMore":false,"abstract":"Mountain ecosystems host rich biodiversity and often act as last refuges for species under growing human pressure. However, the extent and recent trajectory of anthropogenic impacts on global mountain biodiversity remain poorly understood. Here, we evaluate spatio-temporal changes in human pressure across 6717 mountain ranges worldwide from 2000 to 2020 and assess future exposure to anthropogenic pressures under three Shared Socioeconomic Pathways (SSPs). We show that more than 60% of mountain ranges are exposed to elevated human pressure and that intensification of human pressure between 2000 and 2020 is associated with the loss of 71.69 Mha of natural mountain habitat. Protected areas …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"gis","id":249},{"title":"Pandemic shifts in urban place use and subjective wellbeing: Evidence from Stockholm","url":"https://doi.org/10.1016/j.cities.2026.107719","doi":"10.1016/j.cities.2026.107719","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-22","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban design","matchWhere":"摘要：urban design","score":3,"authors":["Chen Feng","Ann Legeby"],"authorMore":false,"abstract":"The COVID-19 pandemic profoundly reshaped everyday life and urban activity patterns. This study examines changes in urban place use during the first year of the pandemic in Stockholm and the association between subjective wellbeing and the characteristics of urban environments that people visited or avoided. Using self-reported data from an online PPGIS map-based survey (n = 650 respondents; 2379 marked places), we examine how built environment attributes and activity purposes jointly characterize places that people used or avoided during the pandemic and how these characteristics relate to perceived wellbeing impacts. Bayesian spatial mixed-effects logistic regression models are used to …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-25","tkey":"gis","id":250},{"title":"Sequential spatial decoupling for street-level crime: An explainable GeoAI framework","url":"https://doi.org/10.1016/j.cities.2026.107731","doi":"10.1016/j.cities.2026.107731","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-22","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"points of interest","matchWhere":"摘要：points of interest","score":3,"authors":["王庆丰","Shen Zhang"],"authorMore":false,"abstract":"Street-level crime is spatially concentrated, yet separating local environmental associations from structured spatial dependence remains difficult in empirical analysis. This study applies a sequential spatial decoupling framework to address this difficulty in central Shanghai, China. Using 8732 street segments and multi-source data, including crime records, street-view imagery, points of interest, and socioeconomic layers, we implement a two-stage approach: (1) ZINB-BYM2 under INLA to estimate structured spatial effects, and (2) XGBoost with SHAP, using the spatial component as a fixed log-offset, to model residual non-linear environmental associations. Across five crime types, the results …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-24","tkey":"gis","id":251},{"title":"Welfare or divide? The impact of smart city construction on life satisfaction among middle-aged and older adults: A quasi-natural experiment from China","url":"https://doi.org/10.1016/j.cities.2026.107698","doi":"10.1016/j.cities.2026.107698","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-22","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urbanization","matchWhere":"摘要：urbanization","score":3,"authors":["Yuanzhuo Liu","Qifeng Ma","Long Li"],"authorMore":false,"abstract":"As the development of smart city initiatives, concerns have emerged about its inequality of social impacts, particularly in rapidly aging and digitizing societies. This research analyses the effect of smart city construction (SCC) on the life satisfaction of middle-aged and older adults in China, a developing country undergoing urbanization, digital development and aging. Based on panel data from five waves (2011−2020) of the China Health and Retirement Longitudinal Study (CHARLS), we employ a staggered difference-in-differences (DID), approach to estimate the causal impact of SCC. The results indicate that SCC is associated with a statistically significant decline in life satisfaction … ✅ 数据源：24 本刊、68 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-24","tkey":"gis","id":252},{"title":"Optimising resource management in data-scarce environments: A modelling approach for Greater Cairo","url":"https://doi.org/10.1177/23998083261500938","doi":"10.1177/23998083261500938","journal":"Environment and Planning B: Urban Analytics and City Science","jabbr":"Environment and Planning B: Urban Analytics and City Science","pubdate":"2026-10-22","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban planning","matchWhere":"摘要：urban planning","score":3,"authors":["Eman Abou Ziyan","Richard Kingston","Joe Ravetz"],"authorMore":false,"abstract":"Pressing environmental challenges present significant obstacles to cities’ sustainable development and underscore the need for effective resource management. However, resource management studies often overlook or oversimplify the spatial and social dimensions of resource use, limiting their ability to target interventions to specific population groups and integrate them into urban planning. Addressing this requires disaggregated data that capture spatial variation and interdependencies between socio-economic factors and resource consumption. Yet such data are often scarce in Global South contexts, where data limitations frequently hinder meaningful resource management research. This …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-23","tkey":"gis","id":253},{"title":"Beyond proximity: Green space visitation patterns and physical health outcomes","url":"https://doi.org/10.1016/j.cities.2026.107654","doi":"10.1016/j.cities.2026.107654","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urbanization","matchWhere":"摘要：urbanization","score":3,"authors":["Aikaterini Lilli","Fani Konstantinou","Elisavet Tsekeri","Tryfon Daras","Dionysia Denia Kolokotsa"],"authorMore":false,"abstract":"Urban green spaces (GS) are increasingly recognized for mitigating health risks linked to urbanization, yet most research emphasizes proximity rather than actual use in Mediterranean cities. This study examines how GS visitation patterns, demographic characteristics, and physical health outcomes interact in Chania, Crete, addressing gaps in GS exposure and chronic disease prevention. A cross-sectional survey was conducted among 718 adult residents between June and August 2024. Data included demographics, GS use, physical activity, and self-reported health indicators, including BMI, coronary artery disease (CAD), hypertension, and hypercholesterolemia. Chi-square tests and logistic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-23","tkey":"gis","id":254},{"title":"Building digital pregnancies from the single cell up","url":"https://www.science.org/doi/abs/10.1126/sciadv.aen0211?af=R","doi":"10.1126/sciadv.aen0211","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twins","matchWhere":"摘要：digital twins","score":3,"authors":["Adrienne K. Scott"],"authorMore":false,"abstract":"Single-cell digital twins connect in vitro drug screening studies with clinical outcomes, providing a new framework to evaluate therapies and advance precision medicine in pregnancy.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-23","tkey":"gis","id":255},{"title":"Global Cropland Efficiency-Stress Divide: Typological Diagnosis and Reconciling Pathways","url":"https://doi.org/10.1021/acs.est.6c07911","doi":"10.1021/acs.est.6c07911","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Tingyu Hu","Junnian Song","Wei Yang","Xian’en Wang"],"authorMore":false,"abstract":"Abstract Cropland underpins food security but faces mounting resource constraints and environmental pressures. Achieving sustainable agriculture hinges on advancing land use efficiency (LUE) and alleviating land ecological stress (LES). However, a typological framework characterizing LUE and LES remains lacking, hindering the distinction between technical efficiency and ecological sustainability in cropland use. Herein, we establish a coupled LUE-LES diagnostic framework by integrating the super-efficiency slack-based measure model with land ecological footprint accounting. This framework classifies regions into efficiency-stress typologies globally for 2011, 2015, 2019, and 2022, and …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"gis","id":256},{"title":"Single-cell–level digital twins for preterm birth prevention strategies","url":"https://www.science.org/doi/abs/10.1126/sciadv.aed2741?af=R","doi":"10.1126/sciadv.aed2741","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twin","matchWhere":"摘要：digital twin","score":3,"authors":["Jakob Einhaus","Peter Neidlinger","Olivier Fondeur","Masaki Sato","Sasha Anronikov","Kotaro Miyazaki"],"authorMore":true,"abstract":"Digital twin models can accelerate therapeutic development by enabling low-risk testing of candidate interventions. In preterm labor (PTL), a major pregnancy complication where clinical trials face ethical and financial barriers, digital twins are especially valuable for evaluating new therapies targeting immune dysfunctions driving PTL. Yet, current models lack single-cell resolution, limiting detection of cell type–specific mechanisms, off-target effects, and the design of personalized interventions. We present Simulated Immunome Modeling of Clinical Outcomes (SIMCO), a single-cell–level digital twin framework that models immunomodulatory treatment effects on the timing of labor using …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"gis","id":257},{"title":"A Two‐Stage Framework for Detecting Spatial Heterogeneity Boundaries From Irregular Point Observations","url":"https://doi.org/10.1111/tgis.70420","doi":"10.1111/tgis.70420","journal":"Transactions in GIS","jabbr":"Transactions in GIS","pubdate":"2026-10-21","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"spatial analysis","matchWhere":"摘要：spatial analysis","score":3,"authors":["Shijie Gao","Yunxia Li"],"authorMore":false,"abstract":"ABSTRACT Detecting spatial heterogeneity boundaries from irregular point observations is important for understanding abrupt changes in spatial processes and producing interpretable boundary maps. However, irregularly sampled spatial data lack a natural ordering, making conventional one‐dimensional change point detection difficult to apply directly. We develop a modular two‐stage spatial analysis framework that connects spatial interpolation with established change point detection procedures. First, interpolation reconstructs a gridded representation of the underlying spatial field. Second, the interpolated surface is decomposed into geographically ordered one‐dimensional spatial profiles, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"gis","id":258},{"title":"Resource-Oriented Wastewater Treatment through Quorum Quenching─Integration of AnMBR and Donnan Dialysis","url":"https://doi.org/10.1021/acs.est.6c05848","doi":"10.1021/acs.est.6c05848","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-20","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"摘要：methane","score":3,"authors":["Hongyu Zhang","Yuxuan Wan","Liqiu Zhang","Huarong Yu","Haiyang Yang","Fangshu Qu"],"authorMore":false,"abstract":"Abstract Aligned with United Nations Sustainable Development Goal 6, water treatment is shifting from pollution removal to resource recovery and circularity. An integration of AnMBR and a Donnan dialysis (DD) (AnMBR-DD) was proposed to simultaneously recover methane and ammonium, and quorum quenching (QQ) was further incorporated to mitigate membrane fouling and enhance process efficiency. The COD removal efficiency was stably maintained above 80%, and the methane conversion efficiency reached 51.6%. The effluent NH4+-N concentration was controlled at 3–5 mg/L, with a recovery efficiency of 47.1% in the AnMBR-DD. The QQ effectively alleviated biofouling on the ultrafiltration membrane in …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"bgc","id":259},{"title":"High-risk antimicrobial resistance genomic traits in multidrug-resistant Salmonella across China’s food chain: projections to 2050","url":"https://doi.org/10.1038/s41467-026-78346-7","doi":"10.1038/s41467-026-78346-7","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-20","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urbanisation","matchWhere":"摘要：urbanisation","score":3,"authors":["Michelle Baker","Xin Lu","Chengchang Luo","Ge Wu","Alexandre Maciel-Guerra","Komkiew Pinpimai"],"authorMore":true,"abstract":"Abstract Antimicrobial resistance (AMR) is rising globally, yet factors shaping its genomic evolution remain poorly understood. We investigated how socioeconomic, climate, and health factors are associated with AMR spread in multi-drug resistant (MDR) Salmonella enterica across China’s food chain, mapped hotspots and forecasted genomic trait prevalence to 2050. We analysed 2,536 MDR genomes from 15 provinces over 16 years, covering patients, food and non-food workers, meat, livestock, and environmental sources. A machine learning framework integrated genomic surveillance with risk assessment to identify high-risk AMR traits (clinically relevant, MDR, mobile). Regression models linked trait …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"gis","id":260},{"title":"A High‐Capacity and Robust Reversible Watermarking Method for Vector Maps via Coarse‐To‐Fine Polar Grid Embedding","url":"https://doi.org/10.1111/tgis.70407","doi":"10.1111/tgis.70407","journal":"Transactions in GIS","jabbr":"Transactions in GIS","pubdate":"2026-10-20","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"gis","matchWhere":"摘要：gis","score":3,"authors":["Deyu Tong","Fengting Wang","Jingyi Li","Chenyu Wu","Na Ren"],"authorMore":false,"abstract":"ABSTRACT As the primary spatial data format in geographic information systems (GIS), vector maps demand exact coordinate reversibility for copyright protection. However, vector maps encode geographic features as irregularly distributed floating‐point coordinates with limited redundancy. This lack of redundancy forces algorithms to perturb coordinates, creating a trade‐off among capacity, geometric robustness, and exact reversibility. We propose CFPG‐RW, a Coarse‐to‐Fine Polar Grid Reversible Watermarking method built on three mechanisms. First, a triplet‐defined local polar coordinate system provides embedding carriers invariant to rotation, scaling, and translation (RST): differential …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"gis","id":261},{"title":"Spatial patterns of urban population growth-shrinkage differentiation in China and their associations with multidimensional flow networks","url":"https://doi.org/10.1016/j.cities.2026.107685","doi":"10.1016/j.cities.2026.107685","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-19","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"spatial analysis","matchWhere":"摘要：spatial analysis","score":3,"authors":["Yifei Wang","Junxian Zhang","Zixian Wang","Pingjun Sun","Meimei Wang"],"authorMore":false,"abstract":"Urban population growth and shrinkage are intertwined with cities' positions in wider systems of intercity relations. This study examines 330 prefecture-level and above cities in China by combining population change during 2020–2023 with three intercity networks observed in 2023: transportation mobility, online-search attention, and patent collaboration. Spatial analysis and social network analysis are used to characterize population and network patterns, and statistical associations between population-change types and multidimensional network positions. Results show that: (1) Population decline was widespread but generally modest, with 219 cities (66.4%) recording decline and slight …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"gis","id":262},{"title":"Revisiting Gehl through perceived safety: A computational method","url":"https://doi.org/10.1016/j.cities.2026.107672","doi":"10.1016/j.cities.2026.107672","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-19","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban form","matchWhere":"摘要：urban form","score":3,"authors":["Qianchuan Li","Yuhao Kang","Fábio Duarte","Paolo Santi","Lukas Ljungqvist","Vania Aparecida Ceccato"],"authorMore":true,"abstract":"This study examines how ground-floor urban form relates to perceived safety in Stockholm, Sweden, using approximately one million street view images collected between 2010 and 2021 together with multi-source built-environment data. Jan Gehl’s writings discuss perceived safety as part of a human-centered design framework that integrates both traffic- and crime-related safety through street-level environmental design, drawing together ideas also established in broader planning and safety scholarship. Building on Gehl’s integrative framework, we operationalize a set of design attributes emphasized in his work and evaluate their associations with perceived safety scores derived from locally …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"gis","id":263},{"title":"Policy‐Driven Evolution of Sediment in the Yellow River Basin over the Past 2000 Years","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF009243?af=R","doi":"10.1029/2026ef009243","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-19","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Anle Yang","Xiaohui Jiang","Yuxin Lei","Tong Nie","Xujing Li","Shengdong Yang","Fusen Nan","Liangbin Lan"],"authorMore":false,"abstract":"Abstract River sediment load serves as a typical indicator of the interaction between human activities and the natural environment, and historical policies have profoundly altered basin sediment transport processes. In this study, we constructed a quantitative analytical framework based on the policy index to systematically trace the evolutionary trajectories of ecological conservation, land use, and taxation policies in the Yellow River Basin over the past two millennia. We reveal how policy-driven human activities have reshaped land use patterns, and how these changes are linked to the long-term response mechanism of sediment load from the Yellow River. We find that prior to the 1970s, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"gis","id":264},{"title":"Research note: Method for delineating urbanized areas based on mean land parcel area","url":"https://doi.org/10.1016/j.landurbplan.2026.105815","doi":"10.1016/j.landurbplan.2026.105815","journal":"Landscape and Urban Planning","jabbr":"Landscape and Urban Planning","pubdate":"2026-10-19","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land use","matchWhere":"摘要：land use","score":3,"authors":["Agnieszka Bitner","Marcin Fiałkowski","Robert Hołyst"],"authorMore":false,"abstract":"The expansion of growing cities into neighboring areas, known as urban sprawl, is reflected in morphological changes to the land parcel pattern. This paper examines urban cadastral parcel patterns, assuming that population-driven land demand drives fragmentation, and that the degree of fragmentation is proportional to local population density. Adopting a radial analysis of cities, the study analyzes 21 urban systems across three continents to examine how mean land parcel area scales with distance from the city center. The results reveal that mean parcel area increases exponentially within urbanized areas before stabilizing in the surrounding non-urban zone, thereby providing a clear …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"gis","id":265},{"title":"Evaluating mangrove establishment trajectories and carbon recovery potential using a spatial age-based framework","url":"https://doi.org/10.1088/1748-9326/aeb621","doi":"10.1088/1748-9326/aeb621","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-19","topic":"遥感","topics":["遥感"],"matchTerm":"landsat","matchWhere":"摘要：landsat","score":3,"authors":["Yuxuan Zhao","Tong Li","Bohan Zheng","Xinyu Wang","Yifan Wang","Qiyue Zhang"],"authorMore":true,"abstract":"Abstract Mangrove restoration is a vital nature-based solution for climate change mitigation and biodiversity conservation. However, large-scale mangrove restoration success is predominantly evaluated using area-based metrics, which fail to capture the complex temporal trajectories of forest structural and functional recovery. Stand age directly determines structural heterogeneity and carbon stocks, making it a key indicator for monitoring recovery trajectories and estimating carbon stocks. We developed a spatial age-based framework to map established mangrove stands and quantify the existing carbon stock and remaining potential. To this end, we combined an optimized LandTrendr …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"rs","id":266},{"title":"Fe3 + Activation of Metal Sulfides for High-Performance Mercury Removal from Nonferrous Smelting Gas: A Dual Mercury Adsorption Mechanism","url":"https://doi.org/10.1021/acs.est.6c09451","doi":"10.1021/acs.est.6c09451","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染"],"matchTerm":"so2","matchWhere":"摘要：so2","score":3,"authors":["Zixi Zhang","Chaolong Liu","Zhixing Huang","Kaisong Xiang","Fenghua Shen","Hui Liu"],"authorMore":false,"abstract":"Abstract Atmospheric elemental mercury (Hg0) emitted from the nonferrous metallurgy industry poses severe risks to ecosystems. Although metal sulfides are promising in Hg0 adsorption under high-concentration SO2 conditions, they typically suffer from poor performance at elevated temperatures due to weak binding affinity. Herein, a trivalent iron (Fe3+) activation strategy to boost Hg0 adsorption activity of metal sulfides was developed for the first time, which leverages electron-deficient Fe3+ to induce electronic reconstruction. This Fe3+ activation strategy is applicable to various metal sulfides, generating Fe sites with high activity and stability. Among the various candidates, the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"air","id":267},{"title":"Submarine Groundwater Discharge Acts as a Significant Vector for Coastal Organophosphate Esters: Joint Evidence from Pollution Surveys and Radionuclide Analysis","url":"https://doi.org/10.1021/acs.est.6c11341","doi":"10.1021/acs.est.6c11341","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Li Zhang","Xiang Li","Xinhui He","Xuemin Feng","Bochao Xu","Shuo Yu"],"authorMore":true,"abstract":"Abstract Organophosphate esters (OPEs) are ubiquitous marine contaminants that raise global concern. While surface inputs are well-studied, the role of subsurface transport remains poorly constrained. Submarine groundwater discharge (SGD) drives seawater-groundwater interactions, yet its impact on OPEs behavior remains overlooked. This study comprehensively investigates the distribution, transport property and sources of OPEs from coastal groundwater to seawater in the Beibu Gulf, China. No statistically significant difference in Σ19OPEs levels was found between groundwater and tidal flat porewater, while both matrices exhibited significantly higher levels than seawater. The high …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"bgc","id":268},{"title":"Threefold Land‐Use Forcing Intensifies Twofold Warming of Urban Europe","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026JD046541?af=R","doi":"10.1029/2026jd046541","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-18","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Basudev Swain","Rui Song","Roy G. Grainger","Marco Vountas"],"authorMore":false,"abstract":"Abstract Europe is warming much faster than the global average, yet the relative contributions of individual anthropogenic drivers to its urban warming remain uncertain. Using CMIP5 single-forcing simulations and observations from HadCRUT5 data set, we determine the influence of greenhouse gases (GHGs), aerosols from anthropogenic sources (Aaer), together with change in land-use (LU) forcing on urban Europe's rising surface air temperature (SAT) since 1850. The local Europe Amplification Factor (EAF), the ratio of regional to global SAT trends, reveals that LU forcing has intensified nearly threefold relative to the global mean since the industrial era, driving urban European warming almost …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-20","tkey":"gis","id":269},{"title":"Modeled Groundwater Decline is Associated with Lower Arsenic Concentrations in Hanoi","url":"https://doi.org/10.1021/acs.est.6c07700","doi":"10.1021/acs.est.6c07700","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-18","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["David Haaf","Michael McGlade","Athena A. Nghiem","Duyen Thi Vu","Tobias Steinert","Viet Hung Pham"],"authorMore":true,"abstract":"Abstract Elevated arsenic concentrations in groundwater pose health risks. Geogenic arsenic contamination is driven by biogeochemical mobilization and groundwater dynamics. Intensive pumping can initially exacerbate contamination by drawing arsenic or mobilizing organic matter into aquifers, but over longer time scales may also promote dilution and flushing in some settings. To better understand the mechanisms controlling arsenic concentrations, we examined changes over two decades in Hanoi (Vietnam), a hotspot of geogenic arsenic contamination and groundwater pumping. Arsenic concentrations from 470 wells sampled in the year 2000 were compared with 434 wells sampled in the same area in … ✅ 数据源：24 本刊、68 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-19","tkey":"bgc","id":270},{"title":"Ammonia Air‐Sea Exchange in Southwest UK","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025GL120401?af=R","doi":"10.1029/2025gl120401","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemistry","matchWhere":"摘要：biogeochemistry","score":3,"authors":["S. Louw","T. G. Bell","E. M. S. Woodward","M. Yang"],"authorMore":false,"abstract":"Abstract Ammonia (NH₃) measurements are challenging to make, and air-sea flux estimates are sparse, with coastal observations complicated by overlapping marine and terrestrial signals. Here we present high-resolution NH₃ air-sea flux estimates based on two years (2022–2023) of atmospheric and seawater measurements at the Penlee Point Atmospheric Observatory (PPAO), on the southwest UK coast. NH₃ concentrations peak in spring and summer and were strongly influenced by terrestrial air masses from the UK and Continental Europe. Net NH₃ deposition occurred across all seasons, with seasonal median deposition ranging from 20.5 to 34.5 μmol m −2 d −1 or 1.0 to 1.8 kg NH₃ -N ha −1 yr −1. The …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"bgc","id":271},{"title":"Interpretable Machine Learning Reveals Global Nonlinear Responses of Soil Respiration to Climate","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL124051?af=R","doi":"10.1029/2026gl124051","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"carbon cycle","matchWhere":"摘要：carbon cycle","score":3,"authors":["Benjamin Laffitte","Zhihan Yang","Tao Zhou","Xiangjun Pei","Xiaolu Tang"],"authorMore":false,"abstract":"Abstract Soil respiration (R s) is a major component of the global carbon cycle, yet its responses to environmental drivers remain poorly constrained. Using 8,111 observations and a SHAP-interpreted Random Forest model, we identified global response patterns for key environmental drivers of R s. Temperature contributions showed a peaked association with a descriptive maximum of 27.7°C, precipitation contributions plateaued at high values, and leaf area index contributions increased approximately linearly. These results provide a global, data-driven characterization of peaked temperature and saturating precipitation associations, including how their shapes and supported ranges vary among …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"bgc","id":272},{"title":"Longwave Scattering Effects on Radiative Kernels","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026JD046597?af=R","doi":"10.1029/2026jd046597","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Han Huang","Yi Huang","Jason N. S. Cole","Jiangnan Li"],"authorMore":false,"abstract":"Abstract Longwave (LW) scattering, the redirection of infrared radiation by cloud and aerosol particles, is often neglected in current global climate models (GCMs). However, studies have suggested that LW scattering can influence the Earth's energy budget and climate sensitivity, indicating a need to improve the representation and understanding of this radiative effect. In addition to mean radiative fluxes, LW scattering can also change radiative sensitivities as quantified by radiative kernels. This aspect of the LW scattering effect, especially on the radiative sensitivity of non-cloud variables, has remained largely unexplored. In this study, we use the Canadian Atmospheric Model (CanAM) …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"air","id":273},{"title":"Medium-Entropy LDH-Driven Electronic Coupling of MnO x for Preferential Oxidation of Formaldehyde","url":"https://doi.org/10.1021/acs.est.6c10822","doi":"10.1021/acs.est.6c10822","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"air pollutant","matchWhere":"摘要：air pollutant","score":3,"authors":["Xuanning Wu","Haiyan Li","Tao Dong","Tao Ban","Michael K.H. Leung","Haibao Huang"],"authorMore":false,"abstract":"Abstract Preferential oxidation of formaldehyde (HCHO) in natural gas engine exhaust is pivotal to prevent NH3–SCR catalyst deactivation and inhibit highly toxic hydrogen cyanide (HCN) formation. Although manganese-based catalysts exhibit prominent activity for HCHO oxidation, complete mineralization is still hindered by poor electron-transfer efficiency and insufficient reactive oxygen species (ROS) generation. Herein, we fabricate hierarchical medium-entropy LDH nanoflower-anchored MnOx catalysts (MnO2@NiMgAl-MELH) via a facile in situ growth strategy, enabling 100% mineralization of HCHO at room temperature. Structural characterizations and DFT calculations verify that Ni–Mn electronic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"air","id":274},{"title":"Perspectives and Mitigation Methods for Underappreciated Amine Escape from CO2 Desorption","url":"https://doi.org/10.1021/acs.est.6c08471","doi":"10.1021/acs.est.6c08471","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Lingyu Shao","Yanlei Meng","Zhengda Yang","Yao Shen","Jingkai Zhao","Jiexu Ye"],"authorMore":true,"abstract":"Abstract Amine-based CO2 capture is increasingly limited by amine escape and aerosol emissions that drive solvent loss and secondary pollution. Research has focused on the absorber, leaving the desorption section─where intensive CO2 release, water-vapor entrainment, and rapid cooling coincide─overlooked as an escape source. Here, we combine molecular dynamics simulations with bench-scale experiments to resolve the mechanism and control of amine escape during CO2 desorption. Counter to absorber-side expectations, a CO2-rich atmosphere suppresses rather than promotes aerosol nucleation: elevated CO2 competitively disrupts the H2O–H2O hydrogen-bond network stabilizing water-centered nuclei, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"air","id":275},{"title":"Dynamic Nature of Soil Iron Minerals: Recent Advances Using Iron Isotope Tracers and Mössbauer Spectroscopy","url":"https://doi.org/10.1021/acs.est.6c07339","doi":"10.1021/acs.est.6c07339","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemistry","matchWhere":"摘要：biogeochemistry","score":3,"authors":["Luiza Notini","Andrew R. C. Grigg","L. Joëlle Kubeneck","Michelle M. Scherer","Ruben Kretzschmar"],"authorMore":false,"abstract":"Abstract Iron plays a central role in defining the redox and surface chemical environment of soils and sediments, by mediating the behavior of nutrients, pollutants, and carbon compounds. However, the mechanisms that drive dynamic changes in Fe speciation and mineral composition can be difficult to trace. Over three decades, technical advances in spectroscopy and theoretical modeling techniques have revealed detailed mechanisms of Fe mineral recrystallization and transformation. Here, we provide a perspective on the application of iron isotopic tracers to the development of atomic-scale mechanistic understanding of Fe mineral dynamics. We review key milestones in the advancement of 57Fe …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"bgc","id":276},{"title":"Molecular Size Mediates Sunlight Effects on the Biodegradation of Aquatic Dissolved Organic Matter: Insights from the Reservoir Wetland and Incubation Experiment","url":"https://doi.org/10.1021/acs.est.6c07764","doi":"10.1021/acs.est.6c07764","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"大气化学","topics":["大气化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical","score":3,"authors":["Peng Zhou","Long Tian","Shian Song","Muhammad Saboor Siddique","Kurt Friese","Peter Herzsprung"],"authorMore":true,"abstract":"Abstract Dissolved organic matter (DOM) in aquatic ecosystems is crucial to climate, water quality, and water sanitation. However, little is known about how photochemical and biological processes interact to regulate the cycling of DOM in water environments. Here, we investigate the photobiochemical processing of different molecular weight (MW) fractions of aquatic DOM by incubating them with microbes in the dark and light/dark cycling environments via microcosm experiments. Light exposure has distinct effects on the medium (MMW; 1–20 kDa) and low (LMW; \u0026lt;1 kDa) MW fractions and can enrich photoautotrophic bacteria and taxa that could benefit the utilization of aromatic compounds. The …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"chem","id":277},{"title":"A century of streamwater quality degradation by input from urban water infrastructure as revealed by tree-ring records","url":"https://doi.org/10.1088/1748-9326/aeb560","doi":"10.1088/1748-9326/aeb560","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban growth","matchWhere":"摘要：urban growth","score":3,"authors":["Josiah Marie Sananda","Jay L Banner","Sneha Nachimuthu","Bryan A Black","Jose Abella-Gutiérrez","Kasey Faust"],"authorMore":true,"abstract":"Abstract The transfer of water from urban water networks to natural streams is a driver of streamwater quality degradation that likely occurs worldwide. We develop a new proxy using tree-ring strontium isotope ratios (87 Sr/ 86 Sr) to reconstruct multidecadal histories of municipal-water contributions to natural streams. We apply this approach to three watersheds spanning highly urbanized, rapidly urbanizing, and rural conditions in central Texas, USA. Municipal water has persistently dominated streamflow (\u003e90%) in the urban watershed since at least 1945, only 25 years after the initial expansion of Austin’s municipal water infrastructure network. In the rapidly urbanizing watershed, the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":278},{"title":"Projecting potential population exposure to the invasive malaria vector Anopheles stephensi","url":"https://doi.org/10.1088/1748-9326/aeb558","doi":"10.1088/1748-9326/aeb558","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban land","matchWhere":"摘要：urban land","score":3,"authors":["Yelin Sun","Weihang Liu","Yuanyuan Jing","Tian Liu","Meng Shang","Yujuan Yue"],"authorMore":true,"abstract":"Abstract Malaria remains a major global public health threat, and the recent invasion and rapid spread of Anopheles stephensi across Africa pose new challenges for disease control. To assess future risks, we estimated the distribution of An. stephensi habitat suitability under four Shared Socioeconomic Pathways (SSPs, SSP126, SSP245, SSP370 and SSP585) across 2021-2100 using a boosted regression tree (BRT) model, and quantified population exposure through a contribution decomposition framework separating environmental, population and joint effects. The results showed that the proportion of urban land was the most important predictor (17.17%), followed by mean temperature of the wettest …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":279},{"title":"ITLN1 suppresses colorectal cancer progression by orchestrating neutrophil maturation and spatial organization","url":"https://doi.org/10.1038/s41467-026-78599-2","doi":"10.1038/s41467-026-78599-2","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"spatial analysis","matchWhere":"摘要：spatial analysis","score":3,"authors":["Li Chen","Xiangwei Zhai","Shaoxiang Chen","Jie Luo","Jing Sun","Guibing Qiao"],"authorMore":true,"abstract":"Abstract Epithelial-derived intelectin-1 (ITLN1) is frequently downregulated in colorectal cancer, but whether it actively shapes anti-tumor immunity remains unclear. We integrate multiplex immunohistochemistry, spatial analysis, single-cell transcriptomics, chromatin-accessibility profiling, and perturbation models to define how ITLN1 regulates neutrophil maturation and spatial anti-tumor immunity. In treatment-naïve human colorectal cancer, higher ITLN1 expression associates with greater neutrophil infiltration, shorter distances between mature S100A9 + CXCR2 + neutrophils and ITLN1 + tumor epithelial cells, and improved survival. In mouse colorectal cancer models, Itln1 silencing …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":280},{"title":"Explainable artificial intelligence reveals spatially divergent effects of global change on mammals","url":"https://doi.org/10.1038/s41467-026-78677-5","doi":"10.1038/s41467-026-78677-5","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-16","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land cover","matchWhere":"摘要：land cover","score":3,"authors":["Lei Song","Amy E. Frazier","Peter Kedron","Diogo S. A. Araujo","Diyang Cui","Brian J. Enquist"],"authorMore":true,"abstract":"Abstract Understanding how global change reshapes species distributions remains a central challenge in ecology, yet most global assessments treat environmental drivers as static, uniform, or aggregate influences. This obscures where, why, and how specific drivers generate ecological risk or opportunity. Here, we apply explainable machine learning to assess how climate averages, variability, extremes, and land cover are projected to reshape future distributions of 1,992 terrestrial mammals. Using Shapley Additive Explanations with species distribution models, we quantify the directional contribution of 16 environmental drivers and track how these contributions change over space and time. We …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":281},{"title":"Passive microwave sea ice concentration biases in the Southern Hemisphere revealed by ICESat-2 linear ice fraction","url":"https://doi.org/10.1016/j.rse.2026.115723","doi":"10.1016/j.rse.2026.115723","journal":"Remote Sensing of Environment","jabbr":"RSE","pubdate":"2026-10-15","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Christopher Horvat","Aikaterini Tavri","Kimia Mohammadnezhad"],"authorMore":false,"abstract":"Gridded sea ice concentration (SIC) data are fundamental for understanding long-term polar climate. Since 1978, daily SIC data have been derived from passive microwave (PM) satellite observations. As SIC is not directly observed, it is obtained through an algorithmic inversion of PM brightness temperatures. Differences between PM-SIC algorithms lead to uncertainty in SIC data. Here we examine differences between several PM-SIC products and focus primarily on two: the National Snow and Ice Data Center (NSIDC) Climate Data Record (CDR), which over our study period is derived from Special Sensor Microwave Imager/Sounder (SSMIS) data, and over the Southern Ocean is largely based on the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-18","tkey":"rs","id":282},{"title":"From plan to plate: Assessing food systems and equity considerations in historical and contemporary comprehensive plans from four U.S. cities","url":"https://doi.org/10.1016/j.cities.2026.107676","doi":"10.1016/j.cities.2026.107676","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-15","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban planning","matchWhere":"摘要：urban planning","score":3,"authors":["Yeeli Mui","Kelsey Crawford","Hameenat Adekoya","Julia A. Wolfson","Keshia Pollack Porter","Jessica C. Jones‐Smith"],"authorMore":false,"abstract":"Urban planning is a structural driver of health, shaping environments that influence everyday activities and resources that can enable or inhibit health, including food systems. Yet, the extent to which comprehensive plans support equity and how this has evolved remains underexplored. This study analyzes historical and contemporary comprehensive plans from four U.S. cities—Chicago, Los Angeles, Minneapolis, and New York City—to assess how equity orientation and food equity considerations have changed over time. Using a structured evaluation instrument comprising 57 indicators, we assess changes in plan strength, comprehensiveness, and content. Results show that while equity orientation has …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":283},{"title":"Uncovering stakeholder preferences for urban blue-green infrastructure siting: Insights from online swing weights elicitation","url":"https://doi.org/10.1016/j.cities.2026.107638","doi":"10.1016/j.cities.2026.107638","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-15","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"gis","matchWhere":"摘要：gis","score":3,"authors":["S. Lacroix","Martijn Kuller","Alice H. Aubert","Danielle Dagenais","Françoise Bichai"],"authorMore":false,"abstract":"Blue-green infrastructure (BGI) location choice requires addressing objectives across environmental, ecological, urban, governance, economic and social domains, necessitating stakeholder engagement. However, preference elicitation in BGI planning often relies on single-disciplinary or expert-driven approaches that may overlook differences in priorities across stakeholder groups. The primary aim of this study was to understand stakeholder priorities for BGI planning objectives across three BGI groups: small systems (bioretention, infiltration systems, and swales), large systems (constructed wetlands and ponds/lakes) and urban trees, while the secondary aim was to test and advance a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":284},{"title":"Between public space and private living: social infrastructure as a demand-side strategy for compact living","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aeaf69","doi":"10.1088/1748-9326/aeaf69","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-15","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban form","matchWhere":"摘要：urban form","score":3,"authors":["Tamar Meshulam and Shoshanna Saxe"],"authorMore":false,"abstract":"Abstract Cities must balance the housing needs of growing populations with planetary boundaries. Technological improvements alone cannot meet climate targets, and demand-side strategies that reduce private dwelling size are critical for achieving absolute reductions in material and energy demand. However, the socio-spatial conditions that enable compact living remain poorly understood. Prior theoretical work suggests that social infrastructure, including cafés, parks, libraries, and community centres, can reduce demand for private residential space, but empirical evidence linking social infrastructure to dwelling size has been virtually absent. We address this gap through a large-scale, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":285},{"title":"Voices from the city: Sentiment across public open space types in Hong Kong before and during COVID-19","url":"https://doi.org/10.1016/j.cities.2026.107652","doi":"10.1016/j.cities.2026.107652","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban planning","matchWhere":"摘要：urban planning","score":3,"authors":["Yan Qian","Sifan Cheng","Yunmi Park"],"authorMore":false,"abstract":"Understanding public sentiment toward public open spaces (POSs) is essential for sustainable urban planning, as these spaces support ecological, social, cultural, and recreational functions. However, despite the diversity of POSs, there has been limited research to systematically examine how public sentiment varies across different POS types. In addition to commercial and recreational features, environmental features such as greenery and waterfronts play a key role in shaping public perceptions. Meanwhile, the COVID-19 pandemic has altered how these spaces are used and may have influenced emotional responses to environmental features. Against this background, this study examined the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":286},{"title":"HPWO model: A housing-price weighted opportunities model for heterogeneous human mobility","url":"https://doi.org/10.1016/j.cities.2026.107684","doi":"10.1016/j.cities.2026.107684","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban planning","matchWhere":"摘要：urban planning","score":3,"authors":["Xiaogang Guo","Mingke Xie","Luliang Tang"],"authorMore":false,"abstract":"Predicting urban human mobility is a vital topic in urban planning, transportation engineering, and public health management. Understanding universal patterns within complex travel distributions is crucial for improving the interpretability and practical applicability of mobility models. However, most existing models rely on demographic data as primary metrics and overlook the heterogeneity in travel generation and attraction, making it difficult to model the diversity of population movements. To address this challenge, this study employs machine learning and spatial statistical methods to uncover the relationship between housing prices and travel behavior. Inspired by intervening …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-17","tkey":"gis","id":287},{"title":"Adapting large language models for urban trip purpose inference: A domain-informed textual representation and fine-tuning framework","url":"https://doi.org/10.1016/j.cities.2026.107680","doi":"10.1016/j.cities.2026.107680","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"points of interest","matchWhere":"摘要：points of interest","score":3,"authors":["Chengzhi Zhang","Shaoying Li","Xiaoyi Ma","Xianlong Chen","Zhou Huang","Zixuan Bai"],"authorMore":true,"abstract":"Understanding why people travel is fundamental to activity-based travel demand modelling and transport policy analysis. However, conventional trip purpose inference methods typically represent mobility contexts using predefined numerical or categorical features, which may discard semantic information contained in raw contextual data, thereby limiting their ability to represent and distinguish diverse travel-related contexts. To address this gap, this study proposes TripPurpose LLM, a domain-informed trip purpose inference framework based on large language models (LLMs). The framework integrates traveller attributes, departure time, transport mode, and semantic information from nearby points …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-16","tkey":"gis","id":288},{"title":"A comprehensive vision-based framework for understanding nation-wide urban socio-demographics","url":"https://doi.org/10.1016/j.cities.2026.107657","doi":"10.1016/j.cities.2026.107657","journal":"Cities","jabbr":"Cities","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"street view","matchWhere":"摘要：street view","score":3,"authors":["Kun Zhou","Yang Chen","Pengyuan Liu","Yujun Hou","Filip Biljecki"],"authorMore":false,"abstract":"Understanding geodemographic distribution across neighbourhoods is essential for identifying socio-spatial differentiation in cities. Traditional geodemographic classification studies rely primarily on various census and socioeconomic data, offering limited insight into the street-level environments through which such differences are experienced and reproduced. In particular, the visual and perceptual dimensions of neighbourhoods remain largely absent from existing classification frameworks. This study advances geodemographic classification research by introducing street view imagery (SVI) as a novel source for capturing latent visual features linked to socio-spatial structure. We propose …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-16","tkey":"gis","id":289},{"title":"Urban vegetation experienced less damage than rural vegetation during the 2022 compound hot–dry event in eastern China","url":"https://doi.org/10.1088/1748-9326/aeb435","doi":"10.1088/1748-9326/aeb435","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"land-use","matchWhere":"摘要：land-use","score":3,"authors":["Zhihan Zhao","Bo Qiu","Jiuyi Chen","Yueyang Ni","Chen Chen"],"authorMore":false,"abstract":"Abstract Compound hot–dry events (CHDEs) increasingly threaten vegetation growth, but whether urban environments amplify or buffer vegetation responses to such extremes remains unclear. This study examined urban–rural contrasts in vegetation responses by integrating standardized enhanced vegetation index (EVI) anomalies with resistance and recovery metrics during the 2022 CHDE over the Yangtze River Basin (YZB) in China. Our results show that the CHDE caused widespread declines in EVI across the YZB, but urban vegetation showed weaker declines than rural vegetation and croplands, together with a smaller damaged area and higher resistance among affected pixels. By contrast, post-event …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-15","tkey":"gis","id":290},{"title":"Turbulent atmospheric particle fluxes in the High Arctic: surface type dependence and variability","url":"https://doi.org/10.5194/acp-26-14507-2026","doi":"10.5194/acp-26-14507-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-13","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Theresa Mathes","Ian Brooks","Sonja Murto","Michael Tjernström","Julia Kojoj","Paul Zieger"],"authorMore":true,"abstract":"The Arctic is warming at a significantly faster rate than the global average. This is altering the sources and sinks of aerosols, which influence the regional radiation balance and cloud formation. However, direct observations of turbulent particle fluxes over sea ice are scarce, limiting our understanding of the processes that control the exchange of aerosols between the surface and the atmosphere. During the ARTofMELT campaign in spring 2023, five weeks of continuous eddy covariance measurements of turbulent particle fluxes were conducted in the High Arctic to investigate particle sources and sinks over closed ice, leads, and open water. Overall, net particle deposition dominated, with …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-14","tkey":"air","id":291},{"title":"Influence of irradiance and mixing layer height on the vertical trace matter distribution in the lower planetary boundary layer – drone-based investigation","url":"https://doi.org/10.5194/acp-26-14417-2026","doi":"10.5194/acp-26-14417-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-13","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Lasse Moormann","Friederike Fachinger","Holger Tost","Frank Drewnick"],"authorMore":false,"abstract":"Drone-based atmospheric measurements allow time-resolved investigation of stratification in the lower atmosphere of many atmospherically relevant variables. Measuring a variety of variables can be used, e.g., for mixing layer (height, MLH) identification and examination of the representativity of ground-based measurements in the lowermost boundary layer. We present drone-based vertical profiling during two 2.5-week summer field campaigns in rural Germany to investigate the vertical distribution of trace matter and meteorological variables in the lowermost troposphere. Night-time vertical profiling of temperature, humidity, wind speed, and trace substances (CO₂, O₃, particle mass and …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-14","tkey":"air","id":292},{"title":"Reinforcement learning guided robotic platform that investigates and discovers asymmetric reactions","url":"https://www.nature.com/articles/s41467-026-78271-9","doi":"10.1038/s41467-026-78271-9","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-13","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"digital twin","matchWhere":"摘要：digital twin","score":3,"authors":["Patryk Klochowicz","Ahmad F. Kassir","Chandrakanta Parida","Jarosław M. Granda"],"authorMore":false,"abstract":"Abstract Autonomous robotic platforms accelerate chemical discovery by coupling automated experimentation with algorithmic decision-making, but most lack integrated support for chirality and the sequential decision-making required to explore asymmetric reaction spaces with unknown reactivity and stereochemical outcomes. Here, we report a bespoke robotic platform guided by deep reinforcement learning that autonomously navigates a defined asymmetric reaction space by scouting reaction conditions, discovering chiral products, screening catalysts and mapping substrate scope. The structure-agnostic workflow is enabled by a digital twin of asymmetric catalysis, in which control policies are …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-14","tkey":"gis","id":293},{"title":"A Bayesian MCMC approach for snow density estimation from SMOS over the Northern Hemisphere","url":"https://doi.org/10.1016/j.isprsjprs.2026.09.047","doi":"10.1016/j.isprsjprs.2026.09.047","journal":"ISPRS Journal of Photogrammetry and Remote Sensing","jabbr":"ISPRS Journal of Photogrammetry and Remote Sensing","pubdate":"2026-10-09","topic":"遥感","topics":["遥感"],"matchTerm":"remote sensing","matchWhere":"摘要：remote sensing","score":3,"authors":["Xiaowen Gao","Jinmei Pan","Lingmei Jiang","Zhiqing Peng","Lu Hu","Jianwei Yang"],"authorMore":true,"abstract":"Snow density is a key parameter for calculating snow water equivalent, snow albedo, snow emissivity, and snow mechanical properties. It is therefore essential in water resource management, snow-air energy exchange computation, cold regions engineering design, and avalanche prevention. In a warming climate, snow density is undergoing rapid changes, which pose challenges for static snow density evolution equations in predicting spatiotemporal variability. Therefore, in this paper, we developed a physically-based snow density retrieval algorithm in the Northern Hemisphere based on SMOS (Soil Moisture and Ocean Salinity) L-band multi-angle radiometer. We first mitigated signal contamination …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-12","tkey":"rs","id":294},{"title":"Nationwide deadwood mapping reveals rising mountain forests vulnerability","url":"https://doi.org/10.1016/j.isprsjprs.2026.09.041","doi":"10.1016/j.isprsjprs.2026.09.041","journal":"ISPRS Journal of Photogrammetry and Remote Sensing","jabbr":"ISPRS Journal of Photogrammetry and Remote Sensing","pubdate":"2026-10-08","topic":"遥感","topics":["遥感"],"matchTerm":"remote sensing","matchWhere":"摘要：remote sensing","score":3,"authors":["Luca Ferrari","Lars T. Waser‬","Achilleas Psomas","Clemens Mosig","Teja Kattenborn","Christian Ginzler"],"authorMore":true,"abstract":"Forest mortality is increasing globally under climate change, making detailed, large-scale monitoring essential for understanding ecosystem responses and guiding adaptive forest management. Here, we present a spatio-temporal assessment of standing deadwood in Switzerland from 2018 to 2023, derived from centimeter-scale high-resolution aerial imagery. We reveal a consistent upslope concentration of standing deadwood, with highest shares occurring around mid to high elevations (∼1,500 m), despite declining forest cover, and relative increases of up to 43% in overlapping survey areas following the 2018 drought. Maximum temperature anomalies and conifer dominance were the strongest predictors …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-11","tkey":"rs","id":295},{"title":"Earlier green-up exacerbates northern vegetation sensitivity to flash drought","url":"https://doi.org/10.1038/s41467-026-78296-0","doi":"10.1038/s41467-026-78296-0","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-08","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Wenrui Bai","Quansheng Ge","Constantin M. Zohner","Jun Wang","Shaozhi Lin","Yani Liang"],"authorMore":true,"abstract":"Flash drought–induced relative reduction in vegetation activity and canopy functioning, referred to as vegetation sensitivity, is a crucial measure of drought impacts. While climatic factors influencing vegetation sensitivity are well recognized, the role of phenological shifts remains poorly understood. Using multiple satellite-derived vegetation proxies (NDVI, LAI, SIF, and VOD) during 2001–2021, we show that earlier green-up dates (GUD) exacerbate vegetation sensitivity to flash droughts across 61.2–84.1% of the Northern Hemisphere (\u003e23.5°N). Earlier GUDs enhance pre-drought vegetation growth, especially during the early growing season. Such amplified vegetation growth exacerbates …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-11","tkey":"rs","id":296},{"title":"From literature-derived causal maps to structural diagnosis: advancing urban environmental comfort research","url":"https://doi.org/10.1016/j.uclim.2026.103179","doi":"10.1016/j.uclim.2026.103179","journal":"Urban Climate","jabbr":"Urban Climate","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染"],"matchTerm":"air quality","matchWhere":"摘要：air quality","score":3,"authors":["Sina Ataee","Myriam Alexandra dos Santos Batalha Dias Nunes Lopes","Hélder Relvas"],"authorMore":false,"abstract":"Urban Environmental Comfort (UEC) research spans environmental, spatial, behavioral, and governance domains, yet its knowledge remains fragmented. Our previous study synthesized 72 studies into a 52-variable causal loop diagram (CLD). However, that map could not identify which structures organize feedback, where fragmentation persists, or which missing relationships warrant investigation. This study addresses that limitation through a reproducible framework for structural diagnosis and evidence-guided causal expansion. We assessed literature representation, centrality, community structure, and feedback-loop salience. These dimensions were integrated to distinguish visible hubs from … ✅ 数据源：24 本刊、68 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-11","tkey":"air","id":297},{"title":"Worse urban environments increase transit use under peripheralization: Causal evidence from a natural experim ivities can also improve people’s quality of life by mitigating anxiety, the relative contributions of nature- and non-nature-based recreation to people’s mental health, and the factors that influence them, remain largely unknown. Here, we conducted a survey of 15,522 respondents across China and applied structural equation modeling to show that nature-based recreation is associated with significantly stronger … ✅ 数据源：24 本刊、68 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-11","tkey":"gis","id":299},{"title":"Reduced semi-arid summer carbon dioxide efflux from agrivoltaic compared to conventional horticultural soil","url":"https://doi.org/10.1088/1748-9326/aeb1dd","doi":"10.1088/1748-9326/aeb1dd","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"摘要：soil carbon","score":3,"authors":["Holly Andrews","Fabiana Olea Carrasco","Alyssa Salazar","Zoe Gineris","Talitha H Neesham-McTiernan","G. Darrel Jenerette"],"authorMore":true,"abstract":"Abstract Agrivoltaic (AV) systems that combine horticultural crops with photovoltaic (PV) infrastructure on the same land parcel can provide mutual benefits for crop performance, electricity production, and water use in semi-arid climates. Whether semi-arid AV systems provide additional benefits for soil development and carbon (C) accumulation remains unclear. Larger aboveground biomass and yield production, which has been observed in semi-arid AV for certain crops, may accelerate C loss by supporting more continual and extensive microbial and root respiration, resulting in net zero or negative change in soil C over a growing season. Alternatively, AV systems may retain more soil C by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"bgc","id":300},{"title":"Role of atmospheric circulation and anthropogenic forcing in the extreme 2025 European summer heatwave","url":"https://doi.org/10.1088/17
