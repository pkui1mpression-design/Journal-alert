ts with OP. Six representative dicarbonyl-nitrogen reaction systems were designed to systematically investigate the formation kinetics, molecular characteristics, and photoaging evolution of the products generated from the Maillard-like reactions. All reactions systems generated measurable intrinsic OP, with the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-08","tkey":"air","id":302},{"title":"Synergistic Approaches in PFAS Remediation: Outlook for Sustainable In Situ Mitigation by Combined Adsorption and Photocatalysis","url":"https://doi.org/10.1021/acs.est.6c12980","doi":"10.1021/acs.est.6c12980","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-06","topic":"大气化学","topics":["大气化学"],"matchTerm":"photochemical","matchWhere":"摘要：photochemical","score":3,"authors":["Surabhi Sreenitha Raj","Jingqian Chen","Oscar Cabezuelo","Tetyana M. Budnyak"],"authorMore":false,"abstract":"Abstract Per- and polyfluoroalkyl substances (PFAS) are persistent organic pollutants with widespread environmental occurrence. Their toxicity and resistance to degradation pose serious risks to ecosystems and human health. While existing separation (e.g., adsorption, filtration) and degradation (e.g., photochemical, electrochemical, thermal) technologies can achieve partial PFAS removal, limitations such as high energy demand, poor cost-efficiency, and harsh operating conditions hinder their in situ application. In this context, a synergistic approach, a system in which adsorption and degradation are functionally coupled rather than applied as independent sequential unit operations, has …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"chem","id":303},{"title":"Fine‐Tuning a Machine‐Learned 3D Cloud Climatology Reveals Aspects of Cloud Cover Trends","url":"https://doi.org/10.1029/2026gl123369","doi":"10.1029/2026gl123369","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"遥感","topics":["遥感"],"matchTerm":"geostationary","matchWhere":"摘要：geostationary","score":3,"authors":["Adrià Amell","Simon Pfreundschuh","Patrick Eriksson"],"authorMore":false,"abstract":"Abstract The Chalmers Cloud Ice Climatology (CCIC) is unique among long‐term cloud records: using retrievals from merged geostationary 11 μm observations, it provides continuous 3D estimates of both frozen hydrometeor mass and cloud probability. Here, we present a key update to CCIC: enhanced detection of thin clouds through tuning of its neural network cloud probability outputs. The update delivers robust information from local instantaneous retrievals to long‐term, large‐scale averages. We compare multidecadal, height‐resolved trends in cloud cover from CCIC and ERA5, revealing subtle but emerging long‐term changes in total cloud cover. By exploiting CCIC's capabilities, the contributions …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"rs","id":304},{"title":"Distinct Dependencies of Tropical Cyclone Inner‐Core and Outer‐Region Precipitation on Translation Speed and Intensity","url":"https://doi.org/10.1029/2026gl125340","doi":"10.1029/2026gl125340","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Jingzhe Xu","Shuguang Wang"],"authorMore":false,"abstract":"Abstract This study analyzes how tropical cyclone (TC) precipitation in the inner core (IC) and outer region (OR) varies with translation speed and storm intensity using satellite‐derived precipitation data. Inner core precipitation initially increases with translation speed but decreases at higher speeds, while OR precipitation increases nearly linearly with translation speed. Inner core precipitation is strongly linked to TC intensity, both with and without conditioning on translation speed, whereas OR precipitation increases with intensity primarily for stronger storms. As translation speed increases, the location of maximum precipitation shifts toward the forward‐left quadrant in the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-07","tkey":"rs","id":305},{"title":"Cloud Microphysics and Drizzle Relationships With CCN Modality in Southern Ocean Stratocumuli","url":"https://doi.org/10.1029/2026jd047923","doi":"10.1029/2026jd047923","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-05","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["James G. Hudson","Fatma Emin","Stephen Noble"],"authorMore":false,"abstract":"Abstract Extended‐range high resolution cloud condensation nuclei (CCN) modality relationships to cloud microphysics and drizzle of the First Aerosol Characterization Experiment (ACE 1) were consistent with Physics of Stratocumulus Tops (POST) and Marine Stratus/Stratocumulus Experiment (MASE) observations. Stratus clouds in these three projects demonstrated that bimodal CCN spectra often caused by cloud processing were associated with clouds that contained higher concentrations of smaller droplets and less drizzle than clouds associated with unimodal CCN spectra. Subsequent brighter clouds and greater cloudiness could enhance both indirect aerosol effects (IAE). However, ACE 1 clouds …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-06","tkey":"air","id":306},{"title":"Niche Divergence-Based Identification of Microbial Indicators Tracking Cyanobacterial Bloom Succession: A Metagenomic and Machine Learning Framework","url":"https://doi.org/10.1021/acs.est.6c04563","doi":"10.1021/acs.est.6c04563","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-03","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"摘要：biogeochemical","score":3,"authors":["Kaiwen Yang","Zhen Xie","Wei Li","Yi Ren","Xiao Yi Chen","Xinze Wang"],"authorMore":true,"abstract":"Abstract Cyanobacterial          + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = (a.title+' '+a.abstract+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var ab = a.abstract
      ? '<p class="excerpt">'+esc(trunc(a.abstract,200))+'</p>'
      : '<p class="excerpt none">日报未收录摘要'+(a.matchTerm?'（命中词 '+esc(a.matchTerm)+'）':'')+' · 点击看原文</p>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+esc(a.title)+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+esc(a.title)+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="sec-t">摘要</div>'
      +   (a.abstract
            ? '<p class="abs">'+esc(a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">该条日报未收录摘要。</p>')
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
