<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大气环境文献日报 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
</style>
</head>

, horizontal aerosol spreading is simulated using a Langevin particle model driven by a library of realistic, 2 d Large Eddy Simulations (LES) spanning the meteorological and aerosol phase space of northeast Pacific stratocumulus. The 2D reflectance fields from the LES are superimposed onto …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"air","id":70},{"title":"Physics-constrained transfer learning with a spectral-fidelity-preserving model for satellite remote sensing applications","url":"https://doi.org/10.5194/acp-26-14205-2026","doi":"10.5194/acp-26-14205-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-09","topic":"遥感","matchTerm":"remote sensing","matchWhere":"标题：remote sensing","score":9,"authors":["Min Min","Qiang Yu","Jun Li","Han Lin","Yunheng Xue","Xinran Xia"],"authorMore":true,"abstract":"Accurate spectral transformation across satellite sensors with similar but different spectral response functions (SRFs) is essential for applying the same retrieval algorithms. A novel physics-constrained transfer learning (TL) framework is developed for transferring satellite radiance observations across different sensors while preserving physical consistency. It integrates a core Spectral-Fidelity-Preserving (SFP) model based on extensive radiative transfer simulations, allowing broad adaptability for radiance transformation under diverse satellite observational conditions. Sensitivity experiments demonstrate the robustness of the TL framework relating to radiometric calibration …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-10","tkey":"rs","id":71},{"title":"Soil Protists Consume Viruses to Drive Microbial Nutrient Cycling: Overlooked Trophic Pathways in Soil Food Web","url":"https://doi.org/10.1021/acs.est.6c06384","doi":"10.1021/acs.est.6c06384","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-09","topic":"生物地球化学","matchTerm":"nutrient cy rticle observations","url":"https://doi.org/10.5194/acp-26-14015-2026","doi":"10.5194/acp-26-14015-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-06","topic":"空气污染","matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Yuan Dai","Junfeng Wang","Mindong Chen","Su Zhang","Haiwei Li","Yunjiang Zhang"],"authorMore":true,"abstract":"The balance between sulfur and nitrogen (S-N) precursors influences secondary aerosol formation, yet its cross-phase links to particle composition and mixing states remain poorly constrained. Here, we integrated single-particle aerosol mass spectrometry (SPA-MS) with pollutant and meteorological observations during winter and summer emission control periods (ECPs) and corresponding normal periods (NPs) in Yangzhou, eastern China. By establishing gas-phase (gSNR), particle-phase (pSNR), and number-based (nSNR) sulfur-to-nitrogen ratio metrics, we combined causal inference with interpretable machine learning to analyze the underlying drivers. During ECPs, reduced NOₓ emissions alongside …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":80},{"title":"Measurements of the Size and Physical Properties of Marine Particles Using Atomic Force Microscopy: Implications for Marine Biogeochemical Cycles","url":"https://doi.org/10.1029/2026gl122474","doi":"10.1029/2026gl122474","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"生物地球化学","matchTerm":"biogeochemical","matchWhere":"标题：biogeochemical","score":9,"authors":["Y. Yamada","T. Mochizuki","H. Fukuda","T. Nagata","S. Mitarai"],"authorMore":false,"abstract":"Abstract Particle size and physical properties such as stiffness and adhesiveness affect sinking velocity and flux in the ocean, yet conventional two‐dimensional measurements lack accuracy and mechanical information. In this study, we applied atomic force microscopy (AFM) to quantify three‐dimensional size and physical properties of marine particles. Three hundred and sixty‐eight particles were collected using a marine snow catcher from the pycnocline and benthic boundary layer at three coastal‐to‐offshore stations in the northwestern Pacific. Particle equivalent spherical diameters (ESDs) ranged from 0.4 to 32 μm, with \u003e70% smaller than 10 μm. Two‐dimensional analyses overestimated ESDs of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"bgc","id":81},{"title":"Anthropogenic aerosol reduction contributes to faster flash drought onset in a changing climate","url":"https://doi.org/10.1038/s41467-026-78230-4","doi":"10.1038/s41467-026-78230-4","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-06","topic":"空气污染","matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Jia Wei","Shuo Wang","Weiguang Wang","Jason A. Otkin","Diego G. Miralles","Amir AghaKouchak"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":82},{"title":"High Sewage Sludge Loading Drives N2O-Dominated Warming Potential and Destabilizes Soil Microbial Networks during Ryegrass Cultivation","url":"https://doi.org/10.1021/acs.est.6c10382","doi":"10.1021/acs.est.6c10382","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-05","topic":"生物地球化学","matchTerm":"n2o","matchWhere":"标题：n2o","score":9,"authors":["Yuxin Wang","Jiawei Wang","Bing Zhao","Yuqun Qiu","Xingmin Fu","Fenfen Zhu"],"authorMore":true,"abstract":"Abstract The application of sludge as a fertilizer contributes to greenhouse gas (GHG) emissions, but the associated microbial and geochemical mechanisms across sludge application rates remain unclear. A field experiment evaluated three sludge application rates (0, 3, and 30 kg/m2) under seedling transplanting (T0, T3, and T30), with an additional direct-seeding treatment (S30) at 30 kg/m2 (wet-weight basis). The results indicated that higher sludge rates elevated cumulative CO2 and N2O emissions, with N2O contributing 69.26–97.74% to the total global warming potential. In contrast, sludge application shifted cumulative CH4 fluxes from net emission in T0 to net uptake in all sludge-amended …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-06","tkey":"bgc","id":83},{"title":"Measuring Dry Deposition of Sea Spray Aerosol and Height of Aerosol Plume Using a Controlled Wave Pool","url":"https://doi.org/10.1029/2025jd045479","doi":"10.1029/2025jd045479","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-05","topic":"空气污染","matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Alexander J. Johnson","Raymond J. Santucci","Ivan Savelyev","William Kinee","Peter Buffolino","Sheri Stanke"],"authorMore":true,"abstract":"Abstract Deposition of sea spray aerosols facilitates atmospheric corrosion of materials, requiring maintenance and replacement over time. However, the dimensions of sea spray aerosol plumes produced from breaking waves have not been well‐characterized, limiting useful prediction of particle transport downwind and atmospheric corrosion. Therefore, this project aimed to measure sea spray aerosol production from breaking waves in a controlled environment at several elevations to obtain the height profile of an aerosol plume. Measurements were conducted using a 13.7 × 6.7 m pool with 1.5 m depth filled to 101.6 cm with Instant Ocean® at the Laboratory for Autonomous Systems (LASR), Naval …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-06","tkey":"air","id":84},{"title":"Consistent estimates of carbonyl sulfide and methane stratospheric lifetimes retrieved from AirCore profiles at different latitudes","url":"https://doi.org/10.5194/acp-26-13909-2026","doi":"10.5194/acp-26-13909-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-05","topic":"生物地球化学","matchTerm":"methane","matchWhere":"标题：methane","score":9,"authors":[],"authorMore":false,"abstract":"Consistent estimates of carbonyl sulfide and methane stratospheric lifetimes retrieved from AirCore profiles at different latitudes Alessandro Zanchetta, Steven van Heuven, Rigel Kivi, Michel Ramonet, Andreas Engel, Maarten Krol, and Huilin Chen Atmos. Chem. Phys., 26, 13909–13927, https://doi.org/10.5194/acp-26-13909-2026, 2026 In this study, we calculate the mean lifetime of carbonyl sulfide (COS) and methane (CH4) in the stratosphere from continuous vertical profiles sampled with balloon-borne instruments. We used two methods based on the stratospheric relationship of these gas species with N2O. The estimated stratospheric lifetime range is 69–90 years for COS and 146–172 years for CH4. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-05","tkey":"bgc","id":85},{"title":"Biochar–Straw Interaction Drives Soil Carbon Accrual by Modulating Microbial Metabolic Pathways","url":"https://doi.org/10.1021/acs.est.6c03354","doi":"10.1021/acs.est.6c03354","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-02","topic":"生物地球化学","matchTerm":"soil carbon","matchWhere":"标题：soil carbon","score":9,"authors":["Rui Ma","Yifeng Zhang","Xiaodong Zheng","Xiang Li","Lan Wei","Lianxi Huang"],"authorMore":true,"abstract":"Abstract Straw and biochar additions can enhance long-term carbon storage, yet how their interactions regulate carbon mineralization and allocation remains unclear. We conducted a 360-day microcosm incubation employing a reciprocal 13C-labeling design that paired 13C-labeled straw with unlabeled biochar and unlabeled straw with 13C-labeled biochar and used single-cell Raman spectroscopy and 13C-labeled cell metagenomics. At day 360, biochar reduced cumulative straw-derived 13CO2 from 1391 to 1199 mg C kg–1 soil, while increasing straw-C allocation to fulvic acid (FA) and humic acid (HA) fractions. This shift was associated with enrichment of bacterial taxa such as Chitinophagales and …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"bgc","id":86},{"title":"Deciphering Aerosol-Monsoon Variability over South Asia under different phases of ENSO","url":"https://doi.org/10.1016/j.atmosenv.2026.122400","doi":"10.1016/j.atmosenv.2026.122400","journal":"Atmospheric Environment","jabbr":"Atmos Environ","pubdate":"2026-10-01","topic":"空气污染","matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Anushri Pal","Sushant Das","Saurabh Kumar","Vijayakumar Sivadasan Nair"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"air","id":87},{"title":"Mapping agricultural dynamics in displacement-affected landscapes using satellite foundation model embeddings","url":"https://doi.org/10.1088/1748-9326/aeabbc","doi":"10.1088/1748-9326/aeabbc","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-01","topic":"遥感","matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Abena Boatemaa Asare-Ansah","Jamon Van Den Hoek","Adebowale Daniel Adebayo","Xiao-Peng Song","Catherine Nakalembe"],"authorMore":false,"abstract":"Abstract Sub-Saharan Africa already faces low human development, extreme climate risks, and environmental degradation–pressures compounded by large-scale population displacement resulting from armed conflict. Nowhere are these intersecting challenges more evident than in Uganda, which currently hosts the largest refugee population in Africa (nearly 2 million), straining land management, natural resources, and local food systems. As is common across displacement settings, spatially explicit baseline agricultural data in Uganda’s refugee-hosting regions remain scarce, limiting land-use planning, food security assessments, and humanitarian interventions. We present the first high-resolution …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":88},{"title":"Bulk PM2.5 Masks Oxidative Potential and Reactive Oxygen Species Responses by Metal–Organic Complexation in PM1 and PM1–2.5 Fractions","url":"https://doi.org/10.1021/acs.est.6c09837","doi":"10.1021/acs.est.6c09837","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"空气污染","matchTerm":"pm2.5","matchWhere":"标题：pm2.5","score":9,"authors":["Jianing Liu","Lijin Zeng","Chen Tang","Yuting Shen","Yingjing Miao","Jiewen Huang"],"authorMore":true,"abstract":"Abstract Bulk PM2.5 measurements are widely used to assess the oxidative toxicity of particulate matter, but they integrate size fractions that differ in composition and respiratory deposition. We show that mixing PM1 and PM1–2.5 from a roadside site produces pronounced antagonistic effects on oxidative potential (OP) and reactive oxygen species (ROS) generation, with interaction factors (IFs) below 1 across all end points: OP by the ascorbic acid assay (IF = 0.65–0.81), OP by the dithiothreitol assay (IF = 0.80–0.93), ROS (IF = 0.10–0.88), and mitochondrial superoxide (IF = 0.43–0.78). This antagonism requires metal–organic interactions as metal-free biomass burning PM exhibits strictly …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"air","id":89},{"title":"Tackling fluffy clouds: robust agricultural field boundary delineation from Sentinel-1 and Sentinel-2 satellite image time series","url":"https://doi.org/10.1016/j.rse.2026.115695","doi":"10.1016/j.rse.2026.115695","journal":"Remote Sensing of Environment","jabbr":"RSE","pubdate":"2026-10-01","topic":"遥感","matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Foivos I. Diakogiannis","Zheng-Shu Zhou","Jeff Wang","Gonzalo Mata","David A. Henry","Roger Lawes"],"authorMore":true,"abstract":"Accurate delineation of agricultural field boundaries is essential for effective crop monitoring and resource management. However, competing methodologies often face significant challenges, particularly in their reliance on extensive manual efforts for cloud-free data curation and their limited adaptability to diverse global conditions. In this paper, we introduce PTAViT3D, a deep learning architecture specifically designed for processing three-dimensional time series of satellite imagery from either Sentinel-1 (S1) or Sentinel-2 (S2). Additionally, we present PTAViT3D-CA, an extension of the PTAViT3D model incorporating cross-attention mechanisms to fuse S1 and S2 datasets, enhancing …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":90},{"title":"Discrepancies between Sentinel-2 and LiDAR-derived LAI in temperate deciduous forests: Influence of apparent optical depth, radiative transfer priors, and horizontal heterogeneity","url":"https://doi.org/10.1016/j.rse.2026.115698","doi":"10.1016/j.rse.2026.115698","journal":"Remote Sensing of Environment","jabbr":"RSE","pubdate":"2026-10-01","topic":"遥感","matchTerm":"lidar","matchWhere":"标题：lidar","score":9,"authors":["Nathan Corroyez","Jean‐Baptiste Féret","Jérôme Ogée","Jonathan Lenoir","Sylvie Durrieu"],"authorMore":false,"abstract":"Accurate estimation of forest leaf area index (LAI) from satellite images remains challenging due to limited sunlight penetration and intricate scattering through structurally complex canopies. We compared LAI estimated from radiative transfer model PROSAIL hybrid inversion applied to Sentinel-2 (S2) images with LAI derived from airborne LiDAR across three temperate deciduous forests in France. We assessed three factors driving discrepancies between the two estimates: (1) the attenuation of the optical signal reducing the apparent canopy depth contributing to S2 reflectance, (2) the parametrisation of the PROSAIL inversion, and (3) the local horizontal heterogeneity in canopy height. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":91},{"title":"EarthCARE reveals details on the role of rain here cold-start and urban emissions coexist. Following aging in an oxidation flow reactor (OFR), we studied the cellular and acellular effects of the fresh and aged aerosols. Photochemical aging in the OFR increased secondary organic aerosol (SOA) mass by up to 6.9-fold, the oxygen-to-carbon (O:C) ratio from 0.26 to 0.79, and both the intrinsic oxidative potential (OPm) and the volume-normalized oxidative …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"air","id":93},{"title":"The 2023–2024 El Niño as a Preview of Future Tropical Forest Climate","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008071?af=R","doi":"10.1029/2026ef008071","journal":"Earth's Future","jabbr":"Earth's Future","pubdate":"2026-10-07","topic":"遥感","matchTerm":"satellite","matchWhere":"摘要：satellite","score":6,"authors":[],"authorMore":false,"abstract":"Abstract Tropical forests are an important component of the global carbon cycle. Increasingly frequent droughts and heatwaves are undermining their resilience, with far-reaching impacts on local livelihoods and on regional and global hydrological cycles. El Niño events, recurring climate patterns that lead to dry and hot conditions across multiple tropical regions, have always influenced these dynamics, but the 2023–2024 El Niño produced extreme droughts and heatwaves that exceeded the typical El Niño footprint. Here, we place the 2023–2024 El Niño in both past (2000–2024) and future (2025–2100) climatic contexts across pantropical forests. We assess its climatic magnitude using ensembles …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"rs","id":94},{"title":"Spatially Refined Analysis of Emission Burdens and Equity from Light-, Medium-, and Heavy-Duty Vehicle Traffic in the United States","url":"https://doi.org/10.1021/acs.est.6c12227","doi":"10.1021/acs.est.6c12227","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","matchTerm":"particulate matter","matchWhere":"摘要：particulate matter","score":6,"authors":["Brittany Antonczak","Clare Nelson","Tammy M. Thompson","Mindi W. DePaola","Gregory Rowangould"],"authorMore":false,"abstract":"Abstract We estimate block-level emission intensities of nitrogen oxides (NOX) and fine particulate matter (PM2.5) from on-road vehicle traffic for every census block in the United States, combining MOVES-based emission factors with street level traffic data. We use this spatially refined, computationally efficient, and policy-sensitive metric to evaluate emissions burden. Despite comprising less than 11% of vehicle kilometers traveled, we find that medium- and heavy-duty trucks account for 46% of NOX and 50% of PM2.5 emission burden nationally ─ with PM2.5 burden from trucks dominated by exhaust emissions while tire and brake wear constitute nearly half of light-duty vehicle PM2.5 burden. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"air","id":95},{"title":"Surface temperatures drive strong seasonality in urban reactive carbon emissions","url":"https://www.science.org/doi/abs/10.1126/sciadv.aef9622?af=R","doi":"10.1126/sciadv.aef9622","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-07","topic":"空气污染","matchTerm":"air quality","matchWhere":"摘要：air quality","score":6,"authors":["Michael P. Vermeuel","Dylan B. Millet","Róisín Commane","Timothy J. Griffis","Trey A. Maddaleno","Emily B. Franklin"],"authorMore":true,"abstract":"Urban air quality is affected by diverse volatile organic compounds (VOCs), and prior studies reveal a need to understand their seasonal sources. We combine high-resolution mass spectrometry with eddy covariance to quantify VOC fluxes from an urban/suburban New York site during summer and winter. Emissions are strongly seasonal: During summer, twice as many VOCs undergo surface-atmosphere exchange, and molar and reactivity-based fluxes are 2 to 4× higher than in winter. Temperature-dependent emissions from volatile chemical products (VCPs), vegetation, and residences dominate during summer. Ethanol alone accounts for ∼25% of the total flux. During winter, temperature-dependent emissions are …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"air","id":96},{"title":"Fire carbon emission constraints from space-based carbon monoxide retrievals during the 2019 intense burning season in Brazil","url":"https://doi.org/10.5194/acp-26-13929-2026","doi":"10.5194/acp-26-13929-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-06","topic":"空气污染","matchTerm":"emission inventory","matchWhere":"摘要：emission inventory","score":6,"authors":["Anne-Wil van den Berg","Joram J. D. Hooghiem","Auke M. van der Woude","Pieter Rijsdijk","Roland Vernooij","Santiago Botía"],"authorMore":true,"abstract":"In 2019, Brazil experienced an intensive fire season, despite the absence of major climate anomalies to enhance fire activity. Existing carbon monoxide (CO) emission estimates from state-of-the-art fire emission inventories differ by a factor two for the period and region. We provide a top-down estimate on CO emissions from these fires using the new CarbonTracker Europe – Long-Window/Short-Window (CTE-LW/SW) inverse modelling framework driven by column-averaged dry air CO mole fractions (X CO) from the MOPITT and TROPOMI satellite instruments. Our analysis indicates that the 2019 fires in Brazil released approximately 47 TgCO. Although structural atmospheric-chemistry related …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":97},{"title":"Reactive Oxygen Species Trigger Rapid Natural Purification of Soils and Water in Wetlands","url":"https://doi.org/10.1021/acs.est.6c06553","doi":"10.1021/acs.est.6c06553","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"大气化学","matchTerm":"photochemical","matchWhere":"摘要：photochemical","score":6,"authors":["Binbin Wu","Jingyi Wang","Guanghui Yu","Liang Mao","Lin Xu","Guodong Fang"],"authorMore":true,"abstract":"Abstract Wetlands, often referred to as the “Earth’s kidneys”, are essential ecosystems that filter pollutants and regulate biogeochemical processes. However, the mechanisms underlying their rapid self-purification are still in their infancy and lack deep understanding. Here, we propose that reactive oxygen species (ROS) constitute an intrinsic oxidative network that drives accelerated pollutant transformation in wetlands. We summarize that ROS are generated through coupled photochemical and redox-driven processes and are highly concentrated at environmental interfaces, including soil–water, fluctuating redox boundaries, and rhizosphere. These interfaces function as reactive hotspots where …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"chem","id":98},{"title":"Light absorption properties and composition of water-soluble brown carbon in North China Plain: implication for an enhancing role of nitrogenous organic compounds","url":"https://doi.org/10.5194/acp-26-14229-2026","doi":"10.5194/acp-26-14229-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-09","topic":"空气污染","matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Can Wu","Huijun Zhang","Kehan Sun","Rongjie Li","Ziting Yan","Yubao Chen"],"authorMore":true,"abstract":"Brown carbon (BrC), an efficiently light-absorbing carbonaceous aerosol, exerts significant impacts on the global energy budget and regional climate, attracting growing scientific attention. To advance understanding of the spatial variability of atmospheric BrC and its dominant formation pathways in the North China Plain (NCP), light absorption properties, chemical composition and formation process of the water-soluble BrC in 2023 winter were investigated by conducting simultaneous measurements at five sites across the NCP, namely, Beijing, Tianjin, Luancheng (rural site), Handan and Jinan. Our results showed that the average light absorption coefficient at 365 nm (abs 365) in Luancheng …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"air","id":99},{"title":"NeuPlume: generative inversion of atmospheric point-source emissions from sparse observations","url":"https://doi.org/10.5194/acp-26-14185-2026","doi":"10.5194/acp-26-14185-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-09","topic":"生物地球化学","matchTerm":"methane","matchWhere":"摘要：methane","score":3,"authors":["Lei Wang","Xin Ma"],"authorMore":false,"abstract":"Inverting point-source emissions from sparse atmospheric observations is difficult because emission rate, release height, wind speed, turbulence, and plume morphology can compensate for one another. We present NeuPlume, a neural-physical framework that formulates inversion as observation-guided generation and selection of complete three-dimensional concentration fields. A Lagrangian stochastic model builds a scenario-specific forward library, a conditional neural field compresses the simulated fields, and a latent diffusion model learns their conditional distribution. During inversion, diffusion posterior sampling generates candidate fields on a coarse-to-fine parameter grid, and NeuPlume …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"bgc","id":100},{"title":"Wildfires diminish vegetation control on surface runoff","url":"https://www.science.org/doi/abs/10.1126/sciadv.aei3713?af=R","doi":"10.1126/sciadv.aei3713","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-09","topic":"遥感","matchTerm":"satellite","matchWhere":"摘要：satellite","score":3,"authors":["Yuanyuan Peng","Kun Shi","Shun Bi","Qi Guan"],"authorMore":false,"abstract":"Wildfires are increasingly reshaping global terrestrial ecosystems, yet their impacts on the fundamental coupling between vegetation and the hydrological cycle remain poorly understood. Here, we present a global-scale assessment of how wildfire disturbances alter the sensitivity of surface runoff to vegetation dynamics using multidecadal satellite observations and reanalysis datasets. We developed a spatially explicit framework to quantify pre- and postfire runoff-vegetation sensitivity across climatic gradients and fire regimes. We show a widespread and systematic weakening of vegetation control on runoff after wildfires, indicating a fundamental decoupling of hydrology-vegetation …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"rs","id":101},{"title":"On-fault and remote observations of exceptionally long, supershear rupture in the 2025 M 7.7 Mandalay earthquake","url":"https://www.science.org/doi/abs/10.1126/sciadv.aee5191?af=R","doi":"10.1126/sciadv.aee5191","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-09","topic":"遥感","matchTerm":"remote sensing","matchWhere":"摘要：remote sensing","score":3,"authors":["Kejie Chen","Haoran Meng","Zhenguo Zhang","Zijia Wang","Zaiwang Liu","Chris Milliner"],"authorMore":true,"abstract":"Straight faults are considered prone to large supershear ruptures and seismic gaps to likely host future earthquakes. Both predictions may have been fulfilled in the magnitude (M) 7.7 Mandalay earthquake of 28 March 2025 on the Sagaing Fault. Exceptional video footage of the fault rupture, high-rate Global Navigation Satellite System, and seismological and remote sensing data reveal a supershear slip pulse that formed early and ruptured a well-identified seismic gap but propagated well beyond it, resulting in an exceptional rupture length of 510 kilometers. By contrast, the slip pulse observed in the video footage has subshear characteristics. These observations can be reconciled by a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-10","tkey":"rs","id":102},{"title":"Reduced semi-arid summer carbon dioxide efflux from agrivoltaic compared to conventional horticultural soil","url":"https://doi.org/10.1088/1748-9326/aeb1dd","doi":"10.1088/1748-9326/aeb1dd","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"生物地球化学","matchTerm":"soil carbon","matchWhere":"摘要：soil carbon","score":3,"authors":["Holly Andrews","Fabiana Olea Carrasco","Alyssa Salazar","Zoe Gineris","Talitha H Neesham-McTiernan","G. Darrel Jenerette"],"authorMore":true,"abstract":"Abstract Agrivoltaic (AV) systems that combine horticultural crops with photovoltaic (PV) infrastructure on the same land parcel can provide mutual benefits for crop performance, electricity production, and water use in semi-arid climates. Whether semi-arid AV systems provide additional benefits for soil development and carbon (C) accumulation remains unclear. Larger aboveground biomass and yield production, which has been observed in semi-arid AV for certain crops, may accelerate C loss by supporting more continual and extensive microbial and root respiration, resulting in net zero or negative change in soil C over a growing season. Alternatively, AV systems may retain more soil C by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"bgc","id":103},{"title":"Role of atmospheric circulation and anthropogenic forcing in the extreme 2025 European summer heatwave","url":"https://doi.org/10.1088/1748-9326/aeb1e0","doi":"10.1088/1748-9326/aeb1e0","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"空气污染","matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Yan Chen","Wen Chen","Shangfeng Chen","Juan Feng","Tianjiao Ma"],"authorMore":false,"abstract":"Abstract In summer 2025, an extreme heatwave propagated northeastward across Europe, sequentially affecting Southwestern (SWEU) and Northern (NEU) Europe with record-breaking durations in the 1979-2025 record. However, the roles of atmospheric circulation and anthropogenic forcing in the 2025 European high-temperature conditions remain unclear. Here we show that atmospheric circulation explains 82.5% (95% uncertainty interval: 65.0-99.0%) and 51.9% (37.0-65.2%) of the regional mean maximum temperature (Tmax) anomalies averaged over the respective heatwave periods in SWEU and NEU, respectively, based on the flow analogue method. Extreme anticyclonic circulation is associated with extreme …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-09","tkey":"air","id":104},{"title":"Maillard-like Reactions Generate Secondary Organic Products with Oxidative Potential: Mechanisms and Photoaging Enhancement","url":"https://doi.org/10.1021/acs.est.6c12787","doi":"10.1021/acs.est.6c12787","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"空气污染","matchTerm":"aerosol","matchWhere":"摘要：aerosol","score":3,"authors":["Xin Zhu","Qingcai Chen","Tong Sha","Bo Wang","Huan Liu","Yue Yin"],"authorMore":true,"abstract":"Abstract The formation mechanisms and atmospheric evolution of secondary organic aerosols contributing to the oxidative potential (OP) remain poorly understood, limiting the assessment of their potential health impacts. Here, we demonstrate for the first time that atmospheric aqueous Maillard-like reactions constitute an important pathway for generating secondary organic products with OP. Six representative dicarbonyl-nitrogen reaction systems were designed to systematically investigate the formation kinetics, molecular characteristics, and photoaging evolution of the products generated from the Maillard-like reactions. All reactions systems generated measurable intrinsic OP, with the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-08","tkey":"air","id":105},{"title":"Synergistic Approaches in PFAS Remediation: Outlook for Sustainable In Situ Mitigation by Combined Adsorption and Photocatalysis","url":"https://doi.org/10.1021/acs.est.6c12980","doi":"10.1021/acs.est.6c12980","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u       +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
