<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大气环境文献日报 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --ghg-a:#f7c95c;  --ghg-b:#b87300;
  --wx-a:#ff8494;   --wx-b:#c1121f;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-ghg h2{color:#b87300} .g-wx h2{color:#c1121f} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-ghg .cover{background:linear-gradient(135deg,var(--ghg-a),var(--ghg-b))}
.t-wx .cover{background:linear-gradient(135deg,var(--wx-a),var(--wx-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-ghg .av{background:linear-gradient(135deg,var(--ghg-a),var(--ghg-b))}
.t-wx .av{background:linear-gradient(135deg,var(--wx-a),var(--wx-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
</style>

ubstantial …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-25","tkey":"air","id":21},{"title":"Chasing Bubbles: Toward a Standardized Approach for Quantifying Methane Ebullition Using Bubble Traps in Streams and Rivers","url":"https://doi.org/10.1021/acs.est.6c13075","doi":"10.1021/acs.est.6c13075","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-23","topic":"生物地球化学","topics":["生物地球化学","温室气体"],"matchTerm":"methane","matchWhere":"标题：methane、标题：methane","score":18,"authors":["Adam Bednařík","Eva Darenova","Helena Cvetkovic","Charlotte Doebke","Clemens Karwautz","Lukáš Kokrda"],"authorMore":true,"abstract":"Abstract Ebullition transports large quantities of the potent greenhouse gas methane (CH4) from stream sediments into the atmosphere. However, the use of different sampling designs complicates comparisons of CH4 emissions estimates between studies. Here, we present the first systematic review of sampling designs used in the past for assessing fluvial CH4 ebullition rates. In addition, we conducted field experiments to estimate the optimal number of bubble traps and the length of the sampling period, and to assess uncertainties in determining CH4 content in the emitted bubbles. Our results demonstrate considerable spatial variability in bubble fluxes (0–4.8 L m–2 d–1) and CH4 content in the …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-24","tkey":"bgc","id":22},{"title":"Methane Emissions in Melbourne, Australia. Part 2: Improving Prior Estimates Using Synthesis Inversion","url":"https://doi.org/10.1029/2026jd047041","doi":"10.1029/2026jd047041","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-22","topic":"生物地球化学","topics":["生物地球化学","温室气体"],"matchTerm":"methane","matchWhere":"标题：methane、标题：methane","score":18,"authors":["Nasimeh Shahrokhi","Cathy M. Trudinger","P. J. Rayner","J. Ramirez Gamboa","Zoe M. Loh","Christopher G. R. Caldow"],"authorMore":true,"abstract":"Abstract Urban methane emissions remain highly uncertain due to the complexity of overlapping anthropogenic sources and limitations in current bottom‐up inventories. In this study, we apply a synthesis inversion framework to refine sector‐specific methane emissions for the Melbourne region in Australia, using in situ atmospheric observations and a Bayesian inversion approach. Our method incorporates constrained and unconstrained inversions, observational filtering, and ensemble‐based uncertainty quantification, including both ensemble spread and posterior covariance structure. The inversion indicates that prior methane emissions are substantially underestimated, particularly for emissions …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-23","tkey":"bgc","id":23},{"title":"Observing Methane Emissions From Oil and Gas Infrastructure in the Permian Basin Using TROPOMI","url":"https://doi.org/10.1029/2026gl124412","doi":"10.1029/2026gl124412","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-21","topic":"遥感","topics":["遥感","生物地球化学"],"matchTerm":"tropomi","matchWhere":"标题：tropomi、标题：methane","score":18,"authors":["Nikhil Dadheech","Alexander J. Turner"],"authorMore":false,"abstract":"Abstract The Permian Basin is one of the largest methane sources in the United States, yet quantifying emissions at scales needed to attribute them to specific infrastructure remains challenging. Here we present a methane flux inversion from 2018 through 2025 using TROPOMI retrievals and a machine learning surrogate for atmospheric transport (FootNet). We estimate emissions at 1 × 1 spatial resolution and weekly time resolution over the Permian Basin, jointly solving for background concentrations. We find total Permian Basin emissions of 2.6 0.5 Tg/yr (structural uncertainty range: 1.7–3.2 Tg/yr), a factor of 2.4 higher than the EPA inventory, with strong spatial correspondence to gas …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"rs","id":24},{"title":"Amazon carbon emissions driven by human actions amplified by droughts","url":"https://www.nature.com/articles/s41586-026-11168-1","doi":"10.1038/s41586-026-11168-1","journal":"Nature","jabbr":"Nature","pubdate":"2026-10-21","topic":"温室气体","topics":["温室气体","极端天气"],"matchTerm":"carbon emissions","matchWhere":"标题：carbon emissions、标题：droughts","score":18,"authors":["Luciana V. Gatti","Camilla L. Cunha","Juan C. G. Blas","A. Scott Denning","Mariane S. Reis","Luciano Marani"],"authorMore":true,"abstract":"Abstract The Amazon carbon sink is weakening as deforestation 1–5, rising tree mortality 6–8 and climate change disrupt the climatic conditions that sustain a humid tropical forest 9–11. Forest loss reduces precipitation, increases temperatures and lengthens the dry season, driving higher carbon emissions 1–4,11,12. Climate stress is stronger in more deforested regions, rendering forests progressively more flammable 1,9,13. Large-scale climate events, such as El Niño, further amplify regional climate impacts 9,14–17. Here we present an analysis of 15 years of Amazonian carbon fluxes derived from atmospheric CO₂ measurements. We determine a carbon balance of 0.32 ± 0.08 PgC yr −1, …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"ghg","id":25},{"title":"A Physics‐Informed Two‐Stage Retrieval Method for EMIT Remote Sensing Methane Plumes","url":"https://doi.org/10.1029/2026jd047122","doi":"10.1029/2026jd047122","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-14","topic":"遥感","topics":["遥感","生物地球化学"],"matchTerm":"remote sensing","matchWhere":"标题：remote sensing、标题：methane","score":18,"authors":["Yong Wan","Yu Liu","Qian Xiao","Shaokun Xu"],"authorMore":false,"abstract":"Abstract Hyperspectral satellite missions, particularly EMIT, have revolutionized methane point source monitoring. However, current operational retrieval pipelines typically rely on physically‐based matched  Ozone Profile Retrievals","url":"https://doi.org/10.1029/2026jd047131","doi":"10.1029/2026jd047131","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-12","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"ozone","matchWhere":"标题：ozone、标题：hyperspectral","score":18,"authors":["Juseon Bak","Xiong Liu","Pamela A. Wales","Viral Shah","Junsung Park","Won‐Jin Lee"],"authorMore":false,"abstract":"Abstract Satellite remote sensing of ozone has progressed from daily global observations by polar‐orbiting platforms to hourly regional monitoring by geostationary platforms. However, retrieving detailed vertical profiles remains challenging because satellite measurements have inherently limited vertical sensitivity. Within the optimal estimation (OE) framework, a priori information constrains the retrieval, preventing unphysical deviations driven by measurement uncertainties while supplementing the limited information content of the observations. In this study, we evaluate ozone profiles from the Goddard Earth Observing System Composition Forecasting (GEOS‐CF) system as an alternative a …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-13","tkey":"air","id":28},{"title":"Atmospheric Removal of Nitrous Oxide: Approaches and Feasibility","url":"https://doi.org/10.1021/acs.est.6c04107","doi":"10.1021/acs.est.6c04107","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染","大气化学","生物地球化学"],"matchTerm":"ozone","matchWhere":"摘要：ozone、摘要：atmospheric lifetime、标题：nitrous oxide","score":15,"authors":["William J. Sawyer"],"authorMore":false,"abstract":"Abstract Nitrous oxide (N2O) is the third-largest contributor to anthropogenic greenhouse gas forcing and the dominant anthropogenic ozone-depleting emission. While mitigation can flatten emissions, there is no clear pathway to eliminate residual emissions from agriculture and other diffuse sources, a key challenge for climate stabilization. The potential role of atmospheric removal has not been holistically assessed, yet N2O’s high potency and long atmospheric lifetime indicate the potential for a durable climate benefit. This review synthesizes emerging approaches for atmospheric N2O removal, organized by reaction mechanism (thermal destruction and thermocatalysis, photolysis, gas-phase …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-17","tkey":"air","id":29},{"title":"Aerosol Optical Properties in the Community Radiative Transfer Model for Data Assimilation","url":"https://doi.org/10.1029/2026jd047177","doi":"10.1029/2026jd047177","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染","遥感","大气化学"],"matchTerm":"aerosol","matchWhere":"标题：aerosol、摘要：satellite、摘要：chemical transport model","score":15,"authors":["Cheng Dang","Soyoung Ha","Cheng‐Hsuan Lu","Quanhua Liu","Patrick Stegmann","Yingtao Ma"],"authorMore":true,"abstract":"Abstract Aerosol particles have significant impacts across the Earth System, yet quantifying these impacts remains challenging. An effective technique to predict aerosol distribution and study their impact is data assimilation (DA), for which the aerosol optical properties (AOPs) are critical. AOPs govern the interaction of light with aerosols, serve as the fundamental parameters in aerosol retrieval algorithms, and link the modeled aerosol concentration to retrieval products, such as aerosol optical depth (AOD). Ensuring consistent and scientifically accurate AOPs across aerosol models, observation, and observation operators is therefore essential for aerosol DA. To support this need, on …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-17","tkey":"air","id":30},{"title":"Isotopic composition of aerosol iron from anthropogenic sources: implications for source apportionment of aerosol iron","url":"https://doi.org/10.5194/acp-26-14073-2026","doi":"10.5194/acp-26-14 based on impervious surface fraction. Total precipitation generally increases more rapidly in urban areas than in nearby non-urban reference regions, with about 75% of urban agglomerations showing faster urban wetting. However, this enhancement is primarily driven by light-to-moderate precipitation, for which urbanization …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-25","tkey":"wx","id":32},{"title":"Aerosol–cloud interactions influence the climate response to AMOC weakening","url":"https://doi.org/10.5194/acp-26-14939-2026","doi":"10.5194/acp-26-14939-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-23","topic":"空气污染","topics":["空气污染","温室气体"],"matchTerm":"aerosol","matchWhere":"标题：aerosol、摘要：radiative forcing","score":12,"authors":["Ryan Vella","Ulrike Lohmann"],"authorMore":false,"abstract":"The Atlantic Meridional Overturning Circulation (AMOC) strongly influences regional climate, yet how atmospheric aerosols and aerosol–cloud interactions respond to its weakening remains largely unexplored. Using an aerosol-climate model, we examine how a 60 % AMOC weakening affects aerosols, clouds, and radiation. The weakening drives a hemispheric aerosol redistribution through purely dynamical pathways, increasing the Northern Hemisphere aerosol burden by 41 % through enhanced Saharan dust emissions and longer lifetimes under suppressed wet deposition. Averaged over 40–90° N, in-cloud droplet number increases by 10 % in warm clouds and 11 % in mixed-phase clouds, while enhanced dust …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-24","tkey":"air","id":33},{"title":"Coarse-mode sea spray aerosols enhance warm rain formation in marine low clouds","url":"https://doi.org/10.5194/acp-26-14881-2026","doi":"10.5194/acp-26-14881-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-23","topic":"空气污染","topics":["空气污染","温室气体"],"matchTerm":"aerosols","matchWhere":"标题：aerosols、摘要：radiative fo eather index over the western United States (WUS), with the January 2025 Los Angeles (LA) fire risk as a motivating case study. Results show that the El Niño Southern Oscillation (ENSO), Pacific North American pattern (PNA) and Atlantic Meridional Mode …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"ghg","id":38},{"title":"Emission Mitigation and Climate Warming Increase China’s Ozone Responsiveness to Soil NOₓ Relative to Biogenic VOCs","url":"https://doi.org/10.1021/acs.est.6c09645","doi":"10.1021/acs.est.6c09645","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-21","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"ozone","matchWhere":"标题：ozone、摘要：photochemical","score":12,"authors":["Ling Huang","Xinyu Liu","Zhihui Kong","Greg Yarwood","Chris Emery","Katie Tuite"],"authorMore":false,"abstract":"Abstract Surface ozone (O3) remains a major air quality challenge in China despite recent reductions in anthropogenic emissions. Here, we use regional photochemical modeling to quantify changes in summertime O3 responses to relative perturbations in biogenic volatile organic compounds (BVOCs) and soil nitrogen oxides (NOx) under historical emission conditions and future mitigation and climate scenarios through 2060. Declining anthropogenic emissions increase ozone production efficiency and produce divergent response patterns: the modeled O3 response magnitude to BVOCs perturbations generally decreases, whereas the response magnitude to soil NOx perturbations increases. Under the 2060 …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"air","id":39},{"title":"Efficient Formation of Atmospheric Triplets and Organosulfur from Photochemistry of Non/weakly Light-absorbing Biomass Burning Tracers and S(IV)","url":"https://doi.org/10.1021/acs.est.6c08387","doi":"10.1021/acs.est.6c08387","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-21","topic":"空 aussian deconvolution, and two-dimensional correlation spectroscopy to elucidate the degradation characteristics and sequential temperature-dependent volatile evolution of distiller’s grains (DG), a protein-rich agro-industrial residue. DG pyrolysis exhibited distinct multistage degradation …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"air","id":41},{"title":"Spatial Patterns and Driving Mechanisms of Coupling Coordination Between Urban Expansion and Urban Resilience: Evidence From Multi‐Source Geospatial Data","url":"https://doi.org/10.1111/tgis.70430","doi":"10.1111/tgis.70430","journal":"Transactions in GIS","jabbr":"Transactions in GIS","pubdate":"2026-10-20","topic":"遥感","topics":["遥感","城市地理信息系统"],"matchTerm":"remote sensing","matchWhere":"摘要：remote sensing、标题：geospatial","score":12,"authors":["Wenyi Liu","Dezhi Li","Mingchao Lin","Wentao Wang","Lugang Yu"],"authorMore":false,"abstract":"ABSTRACT With the rapid acceleration of urbanization, understanding the coordination between urban expansion (UE) and urban resilience (UR) has become critical for achieving sustainable urban development. However, the spatial patterns and driving mechanisms of the coupling coordination between UE and UR remain insufficiently understood. This study develops a multi‐source geospatial analysis framework by integrating remote sensing data and socioeconomic statistics to investigate the spatiotemporal evolution, spatial correlation, and influencing factors of UE‐UR coupling coordination in Shandong Province, China, from 2002 to 2022. Urban built‐up areas were extracted using a modified lighting …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"rs","id":42},{"title":"Constraining the vertical profiles of aerosol component and heating rate over east Asia through assimilating CALIOP observations","url":"https://doi.org/10.5194/acp-26-14671-2026","doi":"10.5194/acp-26-14671-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP hanisms of renoxification and nitration in irradiated nitrate-BBOA mixtures remain poorly understood. We experimentally investigate these coupled processes over a wide range of fir-wood BBOA concentrations during aqueous nitrate photolysis (10 mM) under acidic conditions …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-20","tkey":"air","id":44},{"title":"Aqueous Carbonyl-Amino Aggregation Drives Atmospheric Nitrogen-Containing Oligomer Formation in China Haze","url":"https://doi.org/10.1021/acs.est.6c09940","doi":"10.1021/acs.est.6c09940","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-19","topic":"空气污染","topics":["空气污染","生物地球化学"],"matchTerm":"haze","matchWhere":"标题：haze、摘要：nitrogen cycle","score":12,"authors":["Binyu Xiao","Chenlong Liang","Gehui Wang","Rongjie Li","Luyao Chen","Zheng Li"],"authorMore":true,"abstract":"Abstract Nitrogen-containing organic compounds (NOCs) are ubiquitous in the troposphere and contribute to the reactive nitrogen cycle and aerosol light absorption, yet their formation mechanisms remain unclear, especially in polluted regions. Here, we characterized NOCs in PM2.5 during winter haze in the North China Plain (NCP), with a comparison to those in the Sichuan Basin (ScB). Reduced-nitrogen NOCs (Re-NOCs) accounted for 40% of organics detected in the ESI+ mode, highlighting their importance within atmospheric NOCs. Compared to dry haze (DH) in NCP, high-molecular-weight (HMW, m/z \u0026gt; 250) Re-NOCs in humid haze (HH) were enhanced, which positively correlated with NH4+ and the mass …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-20","tkey":"air","id":45},{"title":"Asymptotic behavior of lidar scattering properties of absorbing dust aerosols across Rayleigh and geometrical-optics regimes: theory and implications","url":"https://doi.org/10.5194/acp-26-14487-2026","doi":"10.5194/acp-26-14487-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-1 ournal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-14","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["G. W. Mann","R. Weigel","C. G. Bardeen","L. R. Marshall","C. V. Brodowsky","M. Norgren"],"authorMore":true,"abstract":"Abstract The JGR paper by Lawler et al. (2025, https://doi.org/10.1029/2025jd043530) marks a significant and historic first, the PALMS single‐particle chemical analysis sampling deep stratospheric Arctic vortex air for the first time. The analysis finds ∼90% of sulfate aerosol particles in the deepest stratosphere air (100–130 ppb N₂O) are meteoric‐sulfuric particles, their composition spectra having metal cation peaks strongly indicative of meteoric origin (see Figure 2 of Lawler et al., 2025, https://doi.org/10.1029/2025jd043530). Within this commentary article we note how the research aligns with findings from recent European high‐altitude aircraft field campaigns, measuring higher …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-15","tkey":"air","id":199},{"title":"Apportioning Sources of Nitrogen Oxides in California's San Joaquin Valley Using Observations From Three Airborne Field Campaigns","url":"https://doi.org/10.1029/2026jd047907","doi":"10.1029/2026jd047907","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-14","topic":"空气污染","topics":["空气污染","大气化学","生物地球化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：volatile organic、摘要：methane","score":9,"authors":["Ilana B. Pollack","Andrew Rollins","Eleanor Waxman","Quazi Z. Rasool","Rebecca H. Schwantes","Jeff Peischl"],"authorMore":true,"abstract":"Abstract Emissions of nitrogen oxides (NOₓ = NO + NO₂), a precursor to ozone and secondary aerosol formation have become increasingly important to understand as ozone production transitions to NOₓ limited in most regions of the US. Recent studies suggest that NOₓ emissions associated with agricultural activities, particularly cropland soils, are an increasingly important contributor. California's San Joaquin Valley (SJV) is a prominent agricultural region, with large‐scale cropland and livestock operations that are known sources of nitrogenous emissions. In this work, observations from six summertime research flights, two each from three airborne field campaigns conducted in 2010, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-15","tkey":"air","id":200},{"title":"GAMEMANCIPATION NOW! An intergenerational framework for evaluating games as participatory tools in architecture and urban planning","url":"https://doi.org/10.1177/23998083261488612","doi":"10.1177/23998083261488612","journal":"Environment and Planning B: Urban Analytics and City Science","jabbr":"Environment and Planning B: Urban Analytics and City Science","pubdate":"2026-10-14","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urban planning","matchWhere":"标题：urban planning","score":9,"authors":["Marta Brković Dodig","Jelena Vranješević","Selena Vračar"],"authorMore":false,"abstract":"Games are increasingly used in architecture and urban planning to support participation, learning, and co-design, yet evaluation remains uneven: studies often report engagement and dialogue while less consistently assessing power relations, agency, and whether game outputs translate into influence in planning and design decisions – especially in intergenerational settings that include children. This paper addresses that gap by proposing the GamEmancipation Framework, a built-environment–specific evaluation tool for analogue and digital participatory games (including geogames) that treats adults and children as co-actors. Grounded in a systematic content analysis of literature spanning …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-15","tkey":"gis","id":201},{"title":"Summertime ozone sensitivity to temperature in China: observational evidence and mechanistic attribution in urban and rural areas in the Yangtze River Delta region","url":"https://doi.org/10.5194/acp-26-14439-2026","doi":"10.5194/acp-26-14439-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-13","topic":"空气污染","topics":["空气污染"],"matchTerm":"ozone","matchWhere":"标题：ozone","score":9,"authors":["Chang Su","Massimo Bollasina","James Weber","David Stevenson"],"authorMore":false,"abstract":"As climate change increases frequency and intensity of hot extremes, understanding how elevated temperatures influence surface ozone (O₃) across different chemical regimes is critical. We combine observations from summer 2022 in the Yangtze River Delta (YRD) with controlled United Kingdom Chemistry and Aerosols (UKCA) Box experiments for urban Shanghai and a lower-NOₓ, biogenically influenced Lishui regional environment. Observed daily-maximum O₃ increases with temperature at both sites, with a stronger response in Shanghai. Two-dimensional T -RH distributions show that O₃ rises with temperature and decreases with relative humidity (RH), implying that part of the temperature response …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-14","tkey":"air","id":202},{"title":"Catalyst or Bystander? Disentangling True Catalytic Effects from Confounding Phenomena in Ozone-Based Wastewater Treatment","url":"https://doi.org/10.1021/acs.est.6c10819","doi":"10.1021/acs.est.6c10819","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-13","topic":"空气污染","topics":["空气污染"],"matchTerm":"ozone","matchWhere":"标题：ozone","score":9,"authors":["Shikha Garg","T. David Waite"],"authorMore":false,"abstract":"Abstract Heterogeneous catalytic ozonation has generated thousands of publications over two decades, with these publications articulating a consistent narrative: catalysts enhance ozone decomposition, generate hydroxyl radicals (or other reactive species), and improve contaminant removal beyond that achievable by use of ozone alone. Despite this narrative, performance gains demonstrated at laboratory scale are routinely inconsistent and poorly reproduced at pilot and industrial scale. This perspective argues that the field suffers from a systematic attribution problem with observed enhancements frequently misattributed to catalytic activity when, instead, they arise from gas–liquid mass …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-14","tkey":"air","id":203},{"title":"Seawall‐Induced Isolation Alters Hydrological‐Biogeochemical Conditions in Coastal Wetlands","url":"https://doi.org/10.1029/2026gl125301","doi":"10.1029/2026gl125301","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-13","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"标题：biogeochemical","score":9,"authors":["Bingnan Zhao","Zhijun Dai","Xixing Liang","Wensheng Zhang","Fangbing Xu","Xuefei Mei"],"authorMore":true,"abstract":"Abstract Coastal wetlands are increasingly impacted by tropical cyclones and storm surges. Seawalls and levees built to reduce these hazards disconnect wetlands from adjacent uplands, yet their hydroecological effects remain poorly understood. Using continuous hydrological observations in Chongming Island, Changjiang Estuary, China, we compared seaward and landward wetlands separated by a seawall. CTD sensor data, water quality measurements, and plot surveys revealed that seawall construction weakens tidal connectivity and reduces hydrological exchange landward. Seaward wetlands exhibit tidal‐dominated dynamics with higher salinity and lower chlorophyll (CHL), chemical oxygen demand (COD), …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-14","tkey":"bgc","id":204},{"title":"Covering and Flaring Manure Storage Units as a Methane Mitigation Strategy for Small- to Midsize Dairy Operations in the United States","url":"https://doi.org/10.1021/acs.est.6c08139","doi":"10.1021/acs.est.6c08139","journal":"Environmental Science tion and wildfire risk under cropland loss and urbanization in the western United States","url":"https://iopscience.iop.org/article/10.1088/1748-9326/aeacff","doi":"10.1088/1748-9326/aeacff","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-11","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"urbanization","matchWhere":"标题：urbanization","score":9,"authors":["Austen A Lorenz","Beatrice L Gordon","Gabrielle F S Boisrame","Julia Berkey","Chelsea Cough","Rosemary W H Carroll"],"authorMore":true,"abstract":"Abstract The western United States faces two escalating, co-occurring hazards in the form of persistent water scarcity (drought) and increasingly frequent wildfires in places humans live and recreate. Drought adaptation has emphasized water savings from cropland retirement, while wildfire adaptation has emphasized the fire risks of urbanization. By overlooking what retired cropland becomes and what development replaces, neither has fully examined cropland’s role as a landscape-scale buffer to wildfire in the western US. We demonstrate this buffering capacity across 11 states and 39 years of data, showing that cropland is less likely to burn than other vegetation classes. Within 477 …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-13","tkey":"gis","id":207},{"title":"A method quantifying soil melanin to understand fungal impacts on soil carbon stability","url":"https://www.nature.com/articles/s41467-026-78616-4","doi":"10.1038/s41467-026-78616-4","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-11","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"soil carbon","matchWhere":"标题：soil carbon","score":9,"authors":["Sylwia Adamczyk","Bartosz Adamczyk"],"authorMore":false,"abstract":"Abstract Fungal necromass, particularly dead microbial cells rich in melanin, is an important contributor to long-term soil carbon stabilization. Progress in understanding the role of soil melanin is limited by the lack of n GIS","pubdate":"2026-10-10","topic":"城市地理信息系统","topics":["城市地理信息系统"],"matchTerm":"geospatial","matchWhere":"标题：geospatial","score":9,"authors":["Zi‐Yue Chen","Cheng‐Zhi Qin","Liang‐Jun Zhu","A‐Xing Zhu"],"authorMore":false,"abstract":"ABSTRACT Geospatial analysis workflows are widely used to address complex geographic problems, but their construction is challenging due to dynamic contextual factors like the characteristics of the study area, geo‐models, and datasets during construction process. Current automated approaches typically focus on the workflow executability, neglecting such dynamic influences—defined in this paper as “workflow construction contexts.” This ignorance undermines the rationality and accuracy of workflow modeling. To address this limitation, we propose a new automated approach adaptive to workflow construction contexts, which recursively decomposes the workflow construction process into elementary …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-11","tkey":"gis","id":211},{"title":"The GRACE satellite mission and transformation of global groundwater science","url":"https://doi.org/10.1088/1748-9326/aeb1dc","doi":"10.1088/1748-9326/aeb1dc","journal":"Environmental Research Letters","jabbr":"ERL","pubdate":"2026-10-08","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Mohammad Shamsudduha","Richard G Taylor","Arifin Arifin","Anna Pazola"],"authorMore":false,"abstract":"Abstract Perspective has no abstract","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"rs","id":212},{"title":"Aerosol Deposition in the Human Respiratory System from Distinct Urban Sources Using Multiple Exposure Metrics","url":"https://doi.org/10.1021/acs.est.6c10850","doi":"10.1021/acs.est.6c10850","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-08","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Imre Salma","Máté Vörösmarty","Árpád Farkas"],"authorMore":false,"abstract":"Abstract Targeting specific aerosol sources offers more effective air-quality control than focusing solely on ambient concentrations. Using source apportionment, major contributors to particle number concentrations in the diameter range of 6–1000 nm in urban background of Budapest, Hungary were identified, and their size distributions applied in lung deposition modelling under reference breathing conditions. In this study, we find that most particles penetrate to the deep lung with a maximum deposition at airway generations 17 to 21 depending on physical activity. Deposition fractions vary substantially by source, ranging from 76% (new particle formation) to 27% (solid fuel combustion). …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-09","tkey":"air","id":213},{"title":"Large Methane Emissions during Ice-Melt Periods in a Temperate Pond","url":"https://doi.org/10.1021/acs.est.6c06834","doi":"10.1021/acs.est.6c06834","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-07","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"标题：methane","score":9,"authors":["Xueqi Niu","Zhifeng Yan","Liping Hao","Liu Liu","Si-Liang Li","Mike Peacock"],"authorMore":false,"abstract":"Abstract Large methane (CH4) emissions during ice-melt periods have been frequently reported in lakes, but whether similar processes occur in ponds remains largely unknown. Here, we conducted observations in a temperate pond across two consecutive ice seasons (2022–2024), with daily sampling during ice melt, to characterize ice-melt CH4 dynamics, reveal potential CH4 production pathways, and estimate the contribution of ice-melt emissions to the annual CH4 budget. CH4 concentrations increased sharply prior to ice melt, resulting in a diffusive pulse during the ice-melt periods (20.1 ± 14.1 mg m–2 h–1), approximately 11 times higher than that during observed ice-free periods (1.8 ± 2.5 mg …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"bgc","id":214},{"title":"Effects of Mineralogical Inhomogeneity on Aggregate Dust Optical Properties and Lidar Observables","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL125856?af=R","doi":"10.1029/2026gl125856","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-07","topic":"遥感","topics":["遥感"],"matchTerm":"lidar","matchWhere":"标题：lidar","score":9,"authors":["Dongchen Li","Ping Yang"],"authorMore":false,"abstract":"Abstract Dust aerosols comprise irregular grains and aggregates with various mineralogical mixtures. However, most optical models use effective refractive indices to represent particles. This study develops an inhomogeneous aggregate model assigning mineral-dependent refractive indices to constituent elements and representing global mineral volume fractions. A synergistically unified approach combining the invariant-imbedding T-matrix, improved geometric optics, and physical-geometric optics methods computes the single-scattering properties. Furthermore, polarized Monte Carlo radiative transfer simulations are conducted to quantify lidar observables. Mineralogical inhomogeneity has little …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"rs","id":215},{"title":"A solid magnesium zincate for hydrogen-methane evolution","url":"https://www.science.org/doi/abs/10.1126/sciadv.aej2622?af=R","doi":"10.1126/sciadv.aej2622","journal":"Science Advances","jabbr":"Sci Adv","pubdate":"2026-10-07","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"methane","matchWhere":"标题：methane","score":9,"authors":["Sheetal Kathayat Bisht","Poorna Gomathisankaran","Alex P. Andrews","Ajay Venugopal"],"authorMore":false,"abstract":"Hydrogen-methane blends are gaining attention as transitional fuels, but their safe storage and controlled release remain a challenge. Advancing this approach necessitates the development of compounds and materials capable of solid-state storage of mixed fuel gases. Molecular precursors capable of delivering both gases from a single source are not known. In this context, we report a low–molecular weight magnesium hydridomethylzincate, Mg[(CH 3)ZnH 3], a crystalline, hydride-rich organometallic compound that does not rely on bulky supporting ligands. Under solvent-free, anaerobic conditions, it releases hydrogen and methane at temperatures as low as 80°C via reductive elimination, leaving …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-08","tkey":"bgc","id":216},{"title":"Cross-phase partitioning of sulfur-nitrogen ratios and aerosol mixing-state evolution based on single-particle observations","url":"https://doi.org/10.5194/acp-26-14015-2026","doi":"10.5194/acp-26-14015-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-06","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Yuan Dai","Junfeng Wang","Mindong Chen","Su Zhang","Haiwei Li","Yunjiang Zhang"],"authorMore":true,"abstract":"The balance between sulfur and nitrogen (S-N) precursors influences secondary aerosol formation, yet its cross-phase links to particle composition and mixing states remain poorly constrained. Here, we integrated single-particle aerosol mass spectrometry (SPA-MS) with pollutant and meteorological observations during winter and summer emission control periods (ECPs) and corresponding normal periods (NPs) in Yangzhou, eastern China. By establishing gas-phase (gSNR), particle-phase (pSNR), and number-based (nSNR) sulfur-to-nitrogen ratio metrics, we combined causal inference with interpretable machine learning to analyze the underlying drivers. During ECPs, reduced NOₓ emissions alongside …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":217},{"title":"Measurements of the Size and Physical Properties of Marine Particles Using Atomic Force Microscopy: Implications for Marine Biogeochemical Cycles","url":"https://doi.org/10.1029/2026gl122474","doi":"10.1029/2026gl122474","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-06","topic":"生物地球化学","topics":["生物地球化学"],"matchTerm":"biogeochemical","matchWhere":"标题：biogeochemical","score":9,"authors":["Y. Yamada","T. Mochizuki","H. Fukuda","T. Nagata","S. Mitarai"],"authorMore":false,"abstract":"Abstract Particle size and physical properties such as stiffness and adhesiveness affect sinking velocity and flux in the ocean, yet conventional two‐dimensional measurements lack accuracy and mechanical information. In this study, we applied atomic force microscopy (AFM) to quantify three‐dimensional size and physical properties of marine particles. Three hundred and sixty‐eight particles were collected using a marine snow catcher from the pycnocline and benthic boundary layer at three coastal‐to‐offshore stations in the northwestern Pacific. Particle equivalent spherical diameters (ESDs) ranged from 0.4 to 32 μm, with \u003e70% smaller than 10 μm. Two‐dimensional analyses overestimated ESDs of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"bgc","id":218},{"title":"Anthropogenic aerosol reduction contributes to faster flash drought onset in a changing climate","url":"https://doi.org/10.1038/s41467-026-78230-4","doi":"10.1038/s41467-026-78230-4","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-06","topic":"空气污染","topics":["空气污染"],"matchTerm":"aerosol","matchWhere":"标题：aerosol","score":9,"authors":["Jia Wei","Shuo Wang","Weiguang Wang","Jason A. Otkin","Diego G. Miralles","Amir AghaKouchak"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-07","tkey":"air","id":219},{"title":"High Sewage Sludge Loading Drives N2O-Dominated Warming Potential and Destabilizes Soil Microbial Networks during Ryegrass Cultivation Asare-Ansah","Jamon Van Den Hoek","Adebowale Daniel Adebayo","Xiao-Peng Song","Catherine Nakalembe"],"authorMore":false,"abstract":"Abstract Sub-Saharan Africa already faces low human development, extreme climate risks, and environmental degradation–pressures compounded by large-scale population displacement resulting from armed conflict. Nowhere are these intersecting challenges more evident than in Uganda, which currently hosts the largest refugee population in Africa (nearly 2 million), straining land management, natural resources, and local food systems. As is common across displacement settings, spatially explicit baseline agricultural data in Uganda’s refugee-hosting regions remain scarce, limiting land-use planning, food security assessments, and humanitarian interventions. We present the first high-resolution …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":225},{"title":"Bulk PM2.5 Masks Oxidative Potential and Reactive Oxygen Species Responses by Metal–Organic Complexation in PM1 and PM1–2.5 Fractions","url":"https://doi.org/10.1021/acs.est.6c09837","doi":"10.1021/acs.est.6c09837","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-01","topic":"空气污染","topics":["空气污染"],"matchTerm":"pm2.5","matchWhere":"标题：pm2.5","score":9,"authors":["Jianing Liu","Lijin Zeng","Chen Tang","Yuting Shen","Yingjing Miao","Jiewen Huang"],"authorMore":true,"abstract":"Abstract Bulk PM2.5 measurements are widely used to assess the oxidative toxicity of particulate matter, but they integrate size fractions that differ in composition and respiratory deposition. We show that mixing PM1 and PM1–2.5 from a roadside site produces pronounced antagonistic effects on oxidative potential (OP) and reactive oxygen species (ROS) generation, with interaction factors (IFs) below 1 across all end points: OP by the ascorbic acid assay (IF = 0.65–0.81), OP by the dithiothreitol assay (IF = 0.80–0.93), ROS (IF = 0.10–0.88), and mitochondrial superoxide (IF = 0.43–0.78). This antagonism requires metal–organic interactions as metal-free biomass burning PM exhibits strictly …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"air","id":226},{"title":"Tackling fluffy clouds: robust agricultural field boundary delineation from Sentinel-1 and Sentinel-2 satellite image time series","url":"https://doi.org/10.1016/j.rse.2026.115695","doi":"10.1016/j.rse.2026.115695","journal":"Remote Sensing of Environment","jabbr":"RSE","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"satellite","matchWhere":"标题：satellite","score":9,"authors":["Foivos I. Diakogiannis","Zheng-Shu Zhou","Jeff Wang","Gonzalo Mata","David A. Henry","Roger Lawes"],"authorMore":true,"abstract":"Accurate delineation of agricultural field boundaries is essential for effective crop monitoring and resource management. However, competing methodologies often face significant challenges, particularly in their reliance on extensive manual efforts for cloud-free data curation and their limited adaptability to diverse global conditions. In this paper, we introduce PTAViT3D, a deep learning architecture specifically designed for processing three-dimensional time series of satellite imagery from either Sentinel-1 (S1) or Sentinel-2 (S2). Additionally, we present PTAViT3D-CA, an extension of the PTAViT3D model incorporating cross-attention mechanisms to fuse S1 and S2 datasets, enhancing …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":227},{"title":"Discrepancies between Sentinel-2 and LiDAR-derived LAI in temperate deciduous forests: Influence of apparent optical depth, radiative transfer priors, and horizontal heterogeneity","url":"https://doi.org/10.1016/j.rse.2026.115698","doi":"10.1016/j.rse.2026.115698","journal":"Remote Sensing of Environment","jabbr":"RSE","pubdate":"2026-10-01","topic":"遥感","topics":["遥感"],"matchTerm":"lidar","matchWhere":"标题：lidar","score":9,"authors":["Nathan Corroyez","Jean‐Baptiste Féret","Jérôme Ogée","Jonathan Lenoir","Sylvie Durrieu"],"authorMore":false,"abstract":"Accurate estimation of forest leaf area index (LAI) from satellite images remains challenging due to limited sunlight penetration and intricate scattering through structurally complex canopies. We compared LAI estimated from radiative transfer model PROSAIL hybrid inversion applied to Sentinel-2 (S2) images with LAI derived from airborne LiDAR across three temperate deciduous forests in France. We assessed three factors driving discrepancies between the two estimates: (1) the attenuation of the optical signal reducing the apparent canopy depth contributing to S2 reflectance, (2) the parametrisation of the PROSAIL inversion, and (3) the local horizontal heterogeneity in canopy height. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-04","tkey":"rs","id":228},{"title":"Relative Humidity Modulates Nitration and Ring Fragmentation during Heterogeneous Oxidation of Catechol by Nitrate Radicals","url":"https://doi.org/10.1021/acs.est.6c10536","doi":"10.1021/acs.est.6c10536","journal":"Environmental Science \u0026 Technology","jabbr":"ES\u0026T","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：secondary organic aerosols","score":6,"authors":["Md. Sohel Rana","Marcelo I. Guzman"],"authorMore":false,"abstract":"Abstract Catechol is an important biomass-burning-derived phenolic compound and a precursor to secondary organic aerosols (SOAs). Although nitrate radicals (NO3) are recognized as major nighttime oxidants, the influence of the aerosol water content on heterogeneous NO3 oxidation of phenolic compounds remains poorly understood. Here, we investigate the impact of relative humidity (RH = 0–90%) on the heterogeneous oxidation of catechol thin films by nitrate radicals generated from the reaction of O3 and NO2. Product formation was characterized using Fourier transform infrared (FTIR) spectroscopy, UV–visible spectroscopy, electrospray ionization mass spectrometry (ESI-MS), ultrahigh-pressure …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-25","tkey":"air","id":229},{"title":"Isotopic Compositions and Source Identification of Atmospheric Particulate Bound Cadmium in Chinese Megacities","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026JD046403?af=R","doi":"10.1029/2026jd046403","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-24","topic":"空气污染","topics":["空气污染","生物地球化学"],"matchTerm":"particulate matter","matchWhere":"摘要：particulate matter、摘要：biogeochemical","score":6,"authors":["Xian Wu","Chen Liu","Xuewu Fu","Guangyi Sun","Hui Zhang","Chao Zhang","Qianwen Deng","Kaihui Tang","Xinbin Feng"],"authorMore":false,"abstract":"Abstract Particulate matter (PM) bound cadmium (Cd) deposition on the Earth's surface poses significant ecological risks to humans and the environment. Cd stable isotopes are useful tracers for understanding sources and biogeochemical cycling in the Earth's ecosystems, yet knowledge of atmospheric Cd isotopic compositions remains limited. Here we present measurements of Cd isotopic compositions in fine particulate matter (PM2.5) in five megacities selected to represent different anthropogenic Cd emission structures across China and explore potential atmospheric Cd sources. The mean (±1 SD) δ 114 Cd values of PM2.5 were −0.231 ± 0.520‰, −0.192 ± 0.265‰, −0.003 ± 0.167‰, 0.005 ± 0.089‰, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-25","tkey":"air","id":230},{"title":"Molecular representation of benzene and phenol secondary organic aerosols","url":"https://doi.org/10.5194/acp-26-14749-2026","doi":"10.5194/acp-26-14749-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-20","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：secondary organic aerosol","score":6,"authors":["Aurélien Le Bayon","Aliisa Ojala","Siddharth Iyer","Zhizhao Wang","Victor Lannuque","Florian Couvidat"],"authorMore":true,"abstract":"Recent experimental and theoretical work has highlighted missing pathways in the oxidation of aromatic compounds, with consequences for the formation of highly oxygenated products relevant to secondary organic aerosol (SOA) formation. In this study we develop an updated, quasi-explicit oxidation mechanism for benzene based on Master Chemical Mechanism (MCM) v3.3.1, extended to represent key multi-generation chemistry. Quantum chemical calculations are used to derive the formation and evolution of geminal-diol bicyclic peroxy radicals and to parameterize the subsequent molecular rearrangements. The mechanism further incorporates autoxidation sequences previously developed for peroxy and …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"air","id":231},{"title":"Cloud Controlling Factor Analysis Reveals E3SMv3 Structural Bias and Mean State Controls on Stratocumulus Radiative Sensitivity","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026GL125263?af=R","doi":"10.1029/2026gl125263","journal":"Geophysical Research Letters","jabbr":"GRL","pubdate":"2026-10-18","topic":"空气污染","topics":["空气污染","遥感"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：aerosol optical depth","score":6,"authors":["T. A. Myers","T. Aerenson","D. T. McCoy","M. D. Zelinka","J. M. Nugent","H. Brown"],"authorMore":false,"abstract":"Abstract We investigate marine stratocumulus cloud radiative sensitivity to meteorological and aerosol controlling factors in a perturbed parameter ensemble of the Energy Exascale Earth System Model version 3 (E3SMv3). The ensemble perturbs 25 cloud, convection, and aerosol parameters, spanning diverse cloud behavior. The default simulation and many ensemble members capture observed responses to most controlling factors, but not to surface temperature advection, revealing a structural deficiency in processes linking stratocumulus to advection. Many members also overestimate cloud fraction and radiative responses to inversion strength, free-tropospheric humidity, and sulfate aerosol optical …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-20","tkey":"air","id":232},{"title":"Aqueous‐Phase Processing of Organic Aerosols at the Southern Great Plains: Insights From Integrated Chemical and Microphysical Analyses","url":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026JD047287?af=R","doi":"10.1029/2026jd047287","journal":"Journal of Geophysical Research: Atmospheres","jabbr":"JGR-A","pubdate":"2026-10-16","topic":"空气污染","topics":["空气污染","大气化学"],"matchTerm":"aerosol","matchWhere":"摘要：aerosol、摘要：secondary organic aerosol","score":6,"authors":["J. Trousdell","W. Jiang","J. Shilling","M. Shrivastava","J. D. Fast","Qi Zhang"],"authorMore":false,"abstract":"Abstract Aqueous-phase reactions are hypothesized to be a major pathway for secondary organic aerosol (SOA) formation in humid, cloud-influenced environments, yet direct observational constraints remain limited. Here we investigated aqueous SOA (aqSOA) formation and evolution during the spring 2016 Holistic Interactions of Shallow Clouds, Aerosols, and Land Ecosystems (HI-SCALE) campaign at the U.S. Department of Energy Southern Great Plains (SGP) site using high-resolution aerosol mass spectrometer (HR-AMS) measurements integrated with particle size distribution and meteorological observations. Positive matrix factorization (PMF) of HR-AMS spectra resolved eight organic aerosol (OA) …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-18","tkey":"air","id":233},{"title":"Linking molecular composition of organic aerosols to reactive oxygen species formation using an MCR-VK framework","url":"https://doi.org/10.5194/acp-26-14655-2026","doi":"10.5194/acp-26-14655-2026","journal":"Atmospheric Chemistry and Physics","jabbr":"ACP","pubdate":"2026-10-1
